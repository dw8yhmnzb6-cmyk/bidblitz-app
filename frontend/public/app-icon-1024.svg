<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0A0A0F"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#F59E0B" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#glow)" opacity="0.6"/>

  <!-- Outer subtle border -->
  <rect x="20" y="20" width="984" height="984" rx="200" ry="200" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>

  <!-- Lightning Bolt (BidBlitz icon) -->
  <g filter="url(#shadow)" transform="translate(512, 512)">
    <path d="M -120 -240 L 80 -240 L 0 -40 L 160 -40 L -100 280 L 0 0 L -180 0 Z"
          fill="url(#bolt)"
          stroke="#FFFFFF"
          stroke-width="6"
          stroke-linejoin="round"/>
  </g>

  <!-- "BB" Monogram below bolt (small) -->
  <text x="512" y="900" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif"
        font-weight="900"
        font-size="120"
        fill="#FFFFFF"
        letter-spacing="-4">BidBlitz</text>
</svg>
