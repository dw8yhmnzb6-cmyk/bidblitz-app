<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0A0A0F"/>
    </linearGradient>
    <linearGradient id="bolt2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="textgrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="glow2" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bg2)"/>
  <rect width="1024" height="500" fill="url(#glow2)"/>

  <!-- Lightning Bolt left -->
  <g transform="translate(170, 250) scale(0.65)">
    <path d="M -120 -240 L 80 -240 L 0 -40 L 160 -40 L -100 280 L 0 0 L -180 0 Z"
          fill="url(#bolt2)"
          stroke="#FFFFFF"
          stroke-width="4"
          stroke-linejoin="round"/>
  </g>

  <!-- App Name -->
  <text x="340" y="225"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif"
        font-weight="900"
        font-size="110"
        fill="url(#textgrad)"
        letter-spacing="-4">BidBlitz</text>

  <!-- Tagline -->
  <text x="340" y="295"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif"
        font-weight="500"
        font-size="36"
        fill="#94A3B8"
        letter-spacing="2">Pay · Bid · Shop · Live</text>

  <!-- Feature pills -->
  <g transform="translate(340, 340)">
    <rect x="0" y="0" width="160" height="44" rx="22" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="2"/>
    <text x="80" y="29" text-anchor="middle"
          font-family="-apple-system, system-ui, sans-serif" font-weight="700" font-size="20" fill="#F59E0B">Live-Auctions</text>

    <rect x="180" y="0" width="160" height="44" rx="22" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="2"/>
    <text x="260" y="29" text-anchor="middle"
          font-family="-apple-system, system-ui, sans-serif" font-weight="700" font-size="20" fill="#60A5FA">POS Pro</text>

    <rect x="360" y="0" width="180" height="44" rx="22" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="2"/>
    <text x="450" y="29" text-anchor="middle"
          font-family="-apple-system, system-ui, sans-serif" font-weight="700" font-size="20" fill="#34D399">BidBlitz Pay</text>
  </g>
</svg>
