# ═══════════════════════════════════════════════
# BidBlitz V2 — Nginx Configuration
# Frontend static + Backend API reverse proxy
# ═══════════════════════════════════════════════

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name bidblitz.example.com www.bidblitz.example.com;
    return 301 https://$host$request_uri;
}

# Redirect www → non-www
server {
    listen 443 ssl http2;
    server_name www.bidblitz.example.com;

    # SSL certificates (managed by certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/bidblitz.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bidblitz.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://bidblitz.example.com$request_uri;
}

# Main server block
server {
    listen 443 ssl http2;
    server_name bidblitz.example.com;

    # SSL
    ssl_certificate /etc/letsencrypt/live/bidblitz.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bidblitz.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Frontend root
    root /var/www/bidblitz-new/frontend;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # ── Backend API reverse proxy ──
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # No buffering for streaming responses (CSV exports)
        proxy_buffering off;
    }

    # ── Auth endpoints: stricter rate limit ──
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Stripe webhook (no rate limit) ──
    location /api/webhook/stripe {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Static assets caching ──
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Access & error logs
    access_log /var/www/bidblitz-new/logs/nginx_access.log;
    error_log /var/www/bidblitz-new/logs/nginx_error.log;
}
