name: Approved central project SSO activation
on:
  push:
    branches: [work/central-admin-activation-20261004]
    paths: [.github/workflows/central-admin-activation.yml]
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configure verified host and existing deployment authentication
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo '212.227.20.190 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDKptYyzslhxZrCw9Sw6geiaiIhalloP+wIAI7IMlNVA' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if [ -n "$DEPLOY_KEY" ]; then
            printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/bidblitz_deploy_key
            chmod 600 ~/.ssh/bidblitz_deploy_key
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Prepare browser before issuing any temporary verification session
        run: |
          npm install --prefix /tmp/admin-activation-browser --no-audit --no-fund playwright
          /tmp/admin-activation-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Activate only live-tested Eyes, Trade, NEX and Stack handoffs
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          SSH=(ssh -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=15)
          SCP=(scp -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=15)
          if [ -f ~/.ssh/bidblitz_deploy_key ]; then
            SSH+=(-i ~/.ssh/bidblitz_deploy_key -o BatchMode=yes)
            SCP+=(-i ~/.ssh/bidblitz_deploy_key -o BatchMode=yes)
          else
            test -n "$SSHPASS"
            SSH=(sshpass -e "${SSH[@]}")
            SCP=(sshpass -e "${SCP[@]}")
          fi
          "${SCP[@]}" scripts/enable_central_admin_sso.py root@212.227.20.190:/tmp/enable_central_admin_sso.py
          "${SSH[@]}" root@212.227.20.190 'cd /var/www/bidblitz/backend && venv/bin/python /tmp/enable_central_admin_sso.py'
          "${SCP[@]}" root@212.227.20.190:/tmp/bidblitz-admin-browser-cookie.txt /tmp/bidblitz-admin-browser-cookie.txt
          "${SSH[@]}" root@212.227.20.190 'rm -f /tmp/bidblitz-admin-browser-cookie.txt'
          chmod 600 /tmp/bidblitz-admin-browser-cookie.txt
          if ! ADMIN_PLAYWRIGHT_PATH=/tmp/admin-activation-browser/node_modules/playwright node scripts/verify_central_sso_live.cjs; then
            "${SSH[@]}" root@212.227.20.190 'cp /var/www/bidblitz/admin-sso-env-backup-20261004/backend.env /var/www/bidblitz/backend/.env; chmod 600 /var/www/bidblitz/backend/.env; pm2 restart api >/dev/null'
            echo 'SSO_FLAGS_ROLLED_BACK_AFTER_BROWSER_FAILURE'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: central-sso-live-browser-evidence
          path: /tmp/admin-sso-browser-results.json
          retention-days: 7
      - name: Remove temporary verification session material
        if: always()
        run: rm -f /tmp/bidblitz-admin-browser-cookie.txt
