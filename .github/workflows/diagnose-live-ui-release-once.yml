name: Diagnose Live UI Release Once
on:
  push:
    branches: [work/cache-update-hardening]
    paths: [.github/workflows/diagnose-live-ui-release-once.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Inspect current production files and endpoints
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@212.227.20.190 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "=== BACKEND FILE MARKERS ==="
          for f in \
            /var/www/bidblitz/backend/core/router_registry.py \
            /var/www/bidblitz/backend/routes/ai_chat.py \
            /var/www/bidblitz/backend/routes/auctions.py \
            /var/www/bidblitz/backend/routes/chat.py \
            /var/www/bidblitz/backend/routes/monitoring.py \
            /var/www/bidblitz/backend/routes/taxi.py \
            /var/www/bidblitz/backend/services/biopay.py; do
            if [ -f "$f" ]; then
              sha256sum "$f"
            else
              echo "MISSING $f"
            fi
          done

          echo "=== FIX PRESENCE ==="
          grep -q '("routes.watchlist", "router")' /var/www/bidblitz/backend/core/router_registry.py && echo WATCHLIST_ROUTER_PRESENT || echo WATCHLIST_ROUTER_ABSENT
          grep -q 'Recommendations failed; serving deterministic fallback' /var/www/bidblitz/backend/routes/ai_chat.py && echo AI_FALLBACK_PRESENT || echo AI_FALLBACK_ABSENT
          grep -q 'nominatim.openstreetmap.org/search' /var/www/bidblitz/backend/routes/taxi.py && echo TAXI_OSM_FALLBACK_PRESENT || echo TAXI_OSM_FALLBACK_ABSENT
          grep -q 'return bool((flag or {}).get("enabled", False))' /var/www/bidblitz/backend/services/biopay.py && echo BIOPAY_NONE_GUARD_PRESENT || echo BIOPAY_NONE_GUARD_ABSENT
          grep -q 'api_error_endpoints' /var/www/bidblitz/backend/routes/monitoring.py && echo ERROR_CENTER_V2_PRESENT || echo ERROR_CENTER_V2_ABSENT

          echo "=== PUBLIC READ-ONLY CHECKS ==="
          for u in \
            https://bidblitz.ae/api/system/version \
            https://bidblitz.ae/api/payments/fee-info \
            https://bidblitz.ae/api/stripe/plans \
            https://bidblitz.ae/api/taxi/pricing \
            https://bidblitz.ae/api/mining/packages; do
            code=$(curl -sS -o /tmp/bbcheck -w "%{http_code}" "$u" || true)
            echo "$code $u"
          done
          REMOTE
