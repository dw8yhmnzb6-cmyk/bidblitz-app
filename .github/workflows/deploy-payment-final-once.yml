name: One-time Final Payment Live Deploy

on:
  push:
    branches:
      - work/cache-update-hardening
    paths:
      - .github/workflows/deploy-payment-final-once.yml

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-payment-final:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact tested source
        uses: actions/checkout@v4
        with:
          ref: 16c219e9a8c41d6b92542339e064fce98db233ad
          fetch-depth: 0

      - name: Verify targeted application delta
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "16c219e9a8c41d6b92542339e064fce98db233ad"

          frontend_changed="$(git diff --name-only c9fdfbda836cef28fea7eebb28c02ceefdcceeac 16c219e9a8c41d6b92542339e064fce98db233ad -- frontend/src | sort)"
          expected_frontend="$(printf '%s\n' \
            frontend/src/components/AppleGooglePayButton.jsx \
            frontend/src/pages/AuctionsPage.jsx | sort)"
          printf 'Frontend delta:\n%s\n' "$frontend_changed"
          test "$frontend_changed" = "$expected_frontend"

          backend_changed="$(git diff --name-only c9fdfbda836cef28fea7eebb28c02ceefdcceeac 16c219e9a8c41d6b92542339e064fce98db233ad -- backend/routes | sort)"
          expected_backend="$(printf '%s\n' \
            backend/routes/apple_google_pay.py \
            backend/routes/auctions.py \
            backend/routes/stripe.py | sort)"
          printf 'Backend route delta:\n%s\n' "$backend_changed"
          test "$backend_changed" = "$expected_backend"

          grep -F 'currency: str = Field(default="eur", pattern="^eur$")' backend/routes/apple_google_pay.py
          grep -F 'protected_metadata_keys = {"user_id", "user_email", "kind"}' backend/routes/apple_google_pay.py
          grep -F 'for package_id, amount in sorted(TOPUP_PACKAGES.items()' backend/routes/stripe.py
          grep -F 'except HTTPException:' backend/routes/auctions.py
          grep -F 'if (!purchaseId) return;' frontend/src/pages/AuctionsPage.jsx
          grep -F "const currency = 'eur';" frontend/src/components/AppleGooglePayButton.jsx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production frontend
        working-directory: frontend
        env:
          CI: 'false'
          GENERATE_SOURCEMAP: 'false'
          REACT_APP_BACKEND_URL: ${{ secrets.PROD_REACT_APP_BACKEND_URL || 'https://bidblitz.ae' }}
          REACT_APP_MAPBOX_TOKEN: ${{ secrets.PROD_REACT_APP_MAPBOX_TOKEN }}
          REACT_APP_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PROD_STRIPE_PUBLISHABLE_KEY || secrets.PROD_REACT_APP_STRIPE_PUBLISHABLE_KEY }}
          REACT_APP_TEST_MODE: 'false'
        run: |
          set -euo pipefail
          export BUILD_ID="$(git rev-parse --short HEAD)-$(date -u +%Y%m%d%H%M%S)"
          cat > .env <<EOF
          REACT_APP_BACKEND_URL=${REACT_APP_BACKEND_URL}
          REACT_APP_MAPBOX_TOKEN=${REACT_APP_MAPBOX_TOKEN}
          REACT_APP_STRIPE_PUBLISHABLE_KEY=${REACT_APP_STRIPE_PUBLISHABLE_KEY}
          REACT_APP_TEST_MODE=false
          REACT_APP_BUILD_ID=${BUILD_ID}
          EOF
          npm run build
          test -s build/index.html
          test -s build/version.json
          test -s build/service-worker.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          version = json.loads(Path("build/version.json").read_text())
          assert version["git_commit"] == "16c219e9a8c41d6b92542339e064fce98db233ad", version
          print("Built final payment frontend:", version["build_id"])
          PY

      - name: Validate backend sources
        run: |
          set -euo pipefail
          python3 -m py_compile backend/routes/stripe.py backend/routes/apple_google_pay.py backend/routes/auctions.py
          grep -F '@router.post("/checkout")' backend/routes/stripe.py
          grep -F '@router.post("/create-payment-intent"' backend/routes/apple_google_pay.py
          grep -F '@router.get("/credits-purchase-status/{session_id}")' backend/routes/auctions.py

      - name: Package targeted release
        run: |
          set -euo pipefail
          tar -C frontend/build -czf /tmp/bidblitz-payment-final-frontend.tgz .
          cp backend/routes/stripe.py /tmp/bidblitz-stripe.py
          cp backend/routes/apple_google_pay.py /tmp/bidblitz-apple-google-pay.py
          cp backend/routes/auctions.py /tmp/bidblitz-auctions.py

      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Upload targeted release
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e scp -o StrictHostKeyChecking=no \
            /tmp/bidblitz-payment-final-frontend.tgz \
            /tmp/bidblitz-stripe.py \
            /tmp/bidblitz-apple-google-pay.py \
            /tmp/bidblitz-auctions.py \
            root@212.227.20.190:/tmp/

      - name: Atomically activate final payment fixes
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@212.227.20.190 'bash -s' <<'REMOTE'
          set -euo pipefail
          BACKEND=/var/www/bidblitz/backend
          FRONTEND=/var/www/bidblitz/frontend
          PY="$BACKEND/venv/bin/python"
          test -x "$PY"
          pm2 describe api >/dev/null
          nginx -t

          STAMP=$(date -u +%Y%m%d%H%M%S)
          BACKUP="/var/www/bidblitz/payment-final-backup-$STAMP"
          OLD_FRONTEND="$FRONTEND/build.previous.$STAMP"
          NEW_FRONTEND="$FRONTEND/build.new"
          mkdir -p "$BACKUP"

          for f in stripe.py apple_google_pay.py auctions.py; do
            test -f "$BACKEND/routes/$f"
            cp -p "$BACKEND/routes/$f" "$BACKUP/$f"
          done

          rm -rf "$NEW_FRONTEND"
          mkdir -p "$NEW_FRONTEND"
          tar -xzf /tmp/bidblitz-payment-final-frontend.tgz -C "$NEW_FRONTEND"
          test -s "$NEW_FRONTEND/index.html"
          test -s "$NEW_FRONTEND/version.json"
          test -s "$NEW_FRONTEND/service-worker.js"

          cp /tmp/bidblitz-stripe.py "$BACKUP/stripe.py.new"
          cp /tmp/bidblitz-apple-google-pay.py "$BACKUP/apple_google_pay.py.new"
          cp /tmp/bidblitz-auctions.py "$BACKUP/auctions.py.new"
          "$PY" -m py_compile "$BACKUP/stripe.py.new" "$BACKUP/apple_google_pay.py.new" "$BACKUP/auctions.py.new"

          backend_swapped=0
          frontend_swapped=0
          rollback() {
            result=$?
            trap - ERR
            if [ "$backend_swapped" = "1" ]; then
              cp -p "$BACKUP/stripe.py" "$BACKEND/routes/stripe.py"
              cp -p "$BACKUP/apple_google_pay.py" "$BACKEND/routes/apple_google_pay.py"
              cp -p "$BACKUP/auctions.py" "$BACKEND/routes/auctions.py"
              pm2 restart api >/dev/null || true
            fi
            if [ "$frontend_swapped" = "1" ]; then
              rm -rf "$FRONTEND/build.failed.$STAMP"
              if [ -d "$FRONTEND/build" ]; then mv "$FRONTEND/build" "$FRONTEND/build.failed.$STAMP"; fi
              if [ -d "$OLD_FRONTEND" ]; then mv "$OLD_FRONTEND" "$FRONTEND/build"; fi
              systemctl reload nginx || true
            fi
            echo "Final payment deploy rolled back; backup: $BACKUP"
            exit "$result"
          }
          trap rollback ERR

          install -m 644 /tmp/bidblitz-stripe.py "$BACKEND/routes/stripe.py"
          install -m 644 /tmp/bidblitz-apple-google-pay.py "$BACKEND/routes/apple_google_pay.py"
          install -m 644 /tmp/bidblitz-auctions.py "$BACKEND/routes/auctions.py"
          backend_swapped=1
          pm2 restart api

          api_ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 http://127.0.0.1:8001/api/stripe/plans >/tmp/stripe-plans.json; then
              api_ready=1
              break
            fi
            sleep 2
          done
          test "$api_ready" = 1

          "$PY" - /tmp/stripe-plans.json <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          plans = data.get("plans") or []
          ids = [str(p.get("package_id")) for p in plans]
          amounts = [float(p.get("amount")) for p in plans]
          assert ids == ["10","25","50","100","250","500"], (ids, amounts)
          assert amounts == [10.0,25.0,50.0,100.0,250.0,500.0], amounts
          print("Stripe top-up plans verified:", ids)
          PY

          if [ -d "$FRONTEND/build" ]; then mv "$FRONTEND/build" "$OLD_FRONTEND"; fi
          mv "$NEW_FRONTEND" "$FRONTEND/build"
          frontend_swapped=1
          chown -R www-data:www-data "$FRONTEND/build"
          nginx -t
          systemctl reload nginx
          curl -fsS --retry 8 --retry-delay 2 https://bidblitz.ae/ >/dev/null

          trap - ERR
          rm -f /tmp/bidblitz-payment-final-frontend.tgz /tmp/bidblitz-stripe.py /tmp/bidblitz-apple-google-pay.py /tmp/bidblitz-auctions.py /tmp/stripe-plans.json
          echo "Final payment fixes activated; backup: $BACKUP; previous frontend: $OLD_FRONTEND"
          REMOTE

      - name: Verify live version and payment provider readiness
        run: |
          set -euo pipefail
          stamp=$(date +%s)
          curl -fsS --retry 8 --retry-delay 2 "https://bidblitz.ae/version.json?deploy=$stamp" -o /tmp/live-version.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          actual = json.loads(Path("/tmp/live-version.json").read_text())
          assert actual["git_commit"] == "16c219e9a8c41d6b92542339e064fce98db233ad", actual
          print("Verified live frontend:", actual["build_id"])
          PY

          curl -fsS https://bidblitz.ae/api/stripe/plans -o /tmp/live-plans.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/live-plans.json"))
          ids=[str(p.get("package_id")) for p in d.get("plans",[])]
          assert ids == ["10","25","50","100","250","500"], ids
          print("Live Stripe plans:", ids)
          PY

          # Safe provider-config checks: no authenticated user and no real charge.
          pi_code="$(curl -sS -o /tmp/pi-check.json -w '%{http_code}'             -X POST -H 'Content-Type: application/json'             --data '{"amount":1,"currency":"eur"}'             https://bidblitz.ae/api/payments/create-payment-intent)"
          test "$pi_code" = "401" -o "$pi_code" = "403"
          echo "Stripe PaymentIntent provider key check -> $pi_code"

          webhook_code="$(curl -sS -o /tmp/webhook-check.json -w '%{http_code}'             -X POST -H 'stripe-signature: invalid-test-signature'             --data '{}'             https://bidblitz.ae/api/payments/webhook/stripe-payment)"
          test "$webhook_code" = "400"
          echo "Stripe PI webhook secret check -> $webhook_code"

          auction_code="$(curl -sS -o /tmp/auction-status-check.json -w '%{http_code}'             https://bidblitz.ae/api/auctions/credits-purchase-status/not-a-real-session)"
          test "$auction_code" = "401" -o "$auction_code" = "403"
          echo "Auction credit status auth check -> $auction_code"
