name: BidBlitz Deployment Secrets Check

on:
  push:
    branches:
      - work/cache-update-hardening
  workflow_dispatch:

jobs:
  verify-secret-presence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Verify required deployment secrets without exposing values
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in VPS_HOST VPS_USER; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is missing or empty"
              missing=1
            else
              echo "${name}: configured"
            fi
          done
          if [ -z "${VPS_PASSWORD:-}" ] && [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "::error::Neither VPS_PASSWORD nor VPS_SSH_KEY is configured"
            missing=1
          else
            if [ -n "${VPS_PASSWORD:-}" ]; then echo "VPS_PASSWORD: configured"; fi
            if [ -n "${VPS_SSH_KEY:-}" ]; then echo "VPS_SSH_KEY: configured"; fi
          fi
          exit "$missing"
