name: BidBlitz Frontend Production Build

on:
  push:
  pull_request:

jobs:
  frontend-production-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install workspace dependencies
        run: npm ci

      - name: Generate production build metadata
        env:
          BUILD_ID: ci-${{ github.sha }}
          BUILD_ENVIRONMENT: production
          BUILD_API_BASE_URL: https://bidblitz.ae
          BUILD_PUBLIC_BASE_URL: https://bidblitz.ae
          BUILD_FRONTEND_VERSION: ci-${{ github.sha }}
          BUILD_SERVICE_WORKER_VERSION: ci-${{ github.sha }}
          BUILD_API_CACHE_VERSION: ci-${{ github.sha }}
        run: python3 scripts/generate_build_info.py

      - name: Inject frontend build id
        working-directory: frontend
        env:
          BUILD_ID: ci-${{ github.sha }}
        run: perl -0pi -e 's/%REACT_APP_BUILD_ID%/'"${BUILD_ID}"'/g' public/index.html

      - name: Build production frontend
        working-directory: frontend
        env:
          BUILD_ID: ci-${{ github.sha }}
          REACT_APP_BACKEND_URL: https://bidblitz.ae
          REACT_APP_BUILD_ID: ci-${{ github.sha }}
          REACT_APP_TEST_MODE: 'false'
          CI: 'false'
          GENERATE_SOURCEMAP: 'false'
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Verify production artifact
        working-directory: frontend
        env:
          BUILD_ID: ci-${{ github.sha }}
        run: |
          set -euo pipefail
          test -f build/index.html
          test -f build/service-worker.js
          test -f build/version.json

          grep -F "meta name=\"bidblitz-build-version\" content=\"${BUILD_ID}\"" build/index.html
          grep -F "const EMBEDDED_BUILD_ID = '${BUILD_ID}'; // BUILD_ID_INJECTED" build/service-worker.js

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          build_id = os.environ['BUILD_ID']
          data = json.loads(Path('build/version.json').read_text())
          assert data.get('build_id') == build_id, (data.get('build_id'), build_id)
          assert data.get('frontend_version') == build_id, (data.get('frontend_version'), build_id)
          assert data.get('service_worker_build_id') == build_id, (data.get('service_worker_build_id'), build_id)
          print(f'Version metadata verified for {build_id}')
          PY

          ! grep -R -E "https?://(localhost|127\.0\.0\.1)([:/]|$)|wss?://(localhost|127\.0\.0\.1)([:/]|$)" build/static/js
          ! grep -R -E "https?://[A-Za-z0-9.-]*preview\.emergentagent\.com([:/]|$)|wss?://[A-Za-z0-9.-]*preview\.emergentagent\.com([:/]|$)" build/static/js
