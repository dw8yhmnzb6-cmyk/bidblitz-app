name: One-time Final QR Payment Live Deploy
on:
  push:
    branches: [work/cache-update-hardening]
    paths: [.github/workflows/deploy-final-qr-once.yml]
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beec9e81579ce45b93b3454e6f09240d3d5a8e98
          fetch-depth: 0
      - name: Verify exact tested QR delta
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "beec9e81579ce45b93b3454e6f09240d3d5a8e98"
          changed="$(git diff --name-only bc4c98b51fc54dd5441046786fa7602d2f696921 beec9e81579ce45b93b3454e6f09240d3d5a8e98 -- frontend/src | sort)"
          expected="$(printf '%s\n' frontend/src/components/BarcodeModal.jsx frontend/src/pages/PaymentPage.jsx | sort)"
          printf '%s\n' "$changed"
          test "$changed" = "$expected"
          grep -F 'QRCodeSVG' frontend/src/components/BarcodeModal.jsx
          grep -F 'value={barcode.barcode}' frontend/src/components/BarcodeModal.jsx
          grep -F 'fetchBarcode(true)' frontend/src/components/BarcodeModal.jsx
          grep -F 'QRCodeSVG' frontend/src/pages/PaymentPage.jsx
          grep -F 'value={barcode.barcode}' frontend/src/pages/PaymentPage.jsx
          grep -F 'refreshPendingRef.current' frontend/src/pages/PaymentPage.jsx
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run offline QR lifecycle regression
        run: node frontend/scripts/test-barcode-lifecycle.cjs frontend/src/components/BarcodeModal.jsx /tmp/qr-results.json
      - name: Build production frontend
        working-directory: frontend
        env:
          CI: 'false'
          GENERATE_SOURCEMAP: 'false'
          REACT_APP_BACKEND_URL: ${{ secrets.PROD_REACT_APP_BACKEND_URL || 'https://bidblitz.ae' }}
          REACT_APP_MAPBOX_TOKEN: ${{ secrets.PROD_REACT_APP_MAPBOX_TOKEN }}
          REACT_APP_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PROD_STRIPE_PUBLISHABLE_KEY || secrets.PROD_REACT_APP_STRIPE_PUBLISHABLE_KEY }}
          REACT_APP_TEST_MODE: 'false'
        run: |
          set -euo pipefail
          export BUILD_ID="$(git rev-parse --short HEAD)-$(date -u +%Y%m%d%H%M%S)"
          cat > .env <<EOF
          REACT_APP_BACKEND_URL=${REACT_APP_BACKEND_URL}
          REACT_APP_MAPBOX_TOKEN=${REACT_APP_MAPBOX_TOKEN}
          REACT_APP_STRIPE_PUBLISHABLE_KEY=${REACT_APP_STRIPE_PUBLISHABLE_KEY}
          REACT_APP_TEST_MODE=false
          REACT_APP_BUILD_ID=${BUILD_ID}
          EOF
          npm run build
          test -s build/index.html
          test -s build/version.json
          python3 - <<'PY'
          import json
          v=json.load(open("build/version.json"))
          assert v["git_commit"] == "beec9e81579ce45b93b3454e6f09240d3d5a8e98", v
          print(v["build_id"])
          PY
      - name: Package frontend
        run: tar -C frontend/build -czf /tmp/bidblitz-final-qr.tgz .
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Upload
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: sshpass -e scp -o StrictHostKeyChecking=no /tmp/bidblitz-final-qr.tgz root@212.227.20.190:/tmp/
      - name: Atomically activate frontend
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@212.227.20.190 'bash -s' <<'REMOTE'
          set -euo pipefail
          FRONTEND=/var/www/bidblitz/frontend
          STAMP=$(date -u +%Y%m%d%H%M%S)
          OLD="$FRONTEND/build.previous.$STAMP"
          NEW="$FRONTEND/build.new"
          rm -rf "$NEW"; mkdir -p "$NEW"
          tar -xzf /tmp/bidblitz-final-qr.tgz -C "$NEW"
          test -s "$NEW/index.html"; test -s "$NEW/version.json"; test -s "$NEW/service-worker.js"
          nginx -t
          swapped=0
          rollback() {
            rc=$?; trap - ERR
            if [ "$swapped" = 1 ]; then
              rm -rf "$FRONTEND/build.failed.$STAMP"
              [ ! -d "$FRONTEND/build" ] || mv "$FRONTEND/build" "$FRONTEND/build.failed.$STAMP"
              [ ! -d "$OLD" ] || mv "$OLD" "$FRONTEND/build"
              systemctl reload nginx || true
            fi
            exit "$rc"
          }
          trap rollback ERR
          [ ! -d "$FRONTEND/build" ] || mv "$FRONTEND/build" "$OLD"
          mv "$NEW" "$FRONTEND/build"; swapped=1
          chown -R www-data:www-data "$FRONTEND/build"
          nginx -t; systemctl reload nginx
          curl -fsS --retry 8 --retry-delay 2 https://bidblitz.ae/ >/dev/null
          trap - ERR
          rm -f /tmp/bidblitz-final-qr.tgz
          REMOTE
      - name: Verify live version
        run: |
          set -euo pipefail
          curl -fsS --retry 8 --retry-delay 2 "https://bidblitz.ae/version.json?deploy=$(date +%s)" -o /tmp/live.json
          python3 - <<'PY'
          import json
          v=json.load(open("/tmp/live.json"))
          assert v["git_commit"] == "beec9e81579ce45b93b3454e6f09240d3d5a8e98", v
          print("LIVE", v["build_id"])
          PY
