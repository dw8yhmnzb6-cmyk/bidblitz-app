name: One-time Payment Hardening Live Deploy

on:
  push:
    branches:
      - work/cache-update-hardening
    paths:
      - .github/workflows/deploy-payment-hardening-once.yml

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-payment-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact tested source
        uses: actions/checkout@v4
        with:
          ref: c9fdfbda836cef28fea7eebb28c02ceefdcceeac
          fetch-depth: 0

      - name: Verify targeted application delta
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c9fdfbda836cef28fea7eebb28c02ceefdcceeac"

          frontend_changed="$(git diff --name-only aa1b12cb48ef73f39c95b5da24e8a58f77209f59 c9fdfbda836cef28fea7eebb28c02ceefdcceeac -- frontend/src | sort)"
          expected_frontend="$(printf '%s\n' \
            frontend/src/pages/BidBlitzPayHostedCheckoutPage.jsx \
            frontend/src/pages/MerchantTerminalPage.jsx \
            frontend/src/pages/PaymentPage.jsx \
            frontend/src/services/api.js | sort)"
          printf 'Frontend delta:\n%s\n' "$frontend_changed"
          test "$frontend_changed" = "$expected_frontend"

          backend_changed="$(git diff --name-only 8977a963c79a44f0b3b7703aead4e89fc9368d80 c9fdfbda836cef28fea7eebb28c02ceefdcceeac -- backend/routes | sort)"
          printf 'Backend route delta:\n%s\n' "$backend_changed"
          test "$backend_changed" = "backend/routes/pos_payments.py"

          grep -F 'getMyBarcode: () => request("/api/payments/my-barcode")' frontend/src/services/api.js
          grep -F 'const L = paymentCopy[locale] || paymentCopy.de;' frontend/src/pages/PaymentPage.jsx
          grep -F 'data-testid="payment-error"' frontend/src/pages/PaymentPage.jsx
          grep -F 'Provider-Anbindung ausstehend' frontend/src/pages/MerchantTerminalPage.jsx
          grep -F 'data-testid="bidblitz-pay-provider-button"' frontend/src/pages/BidBlitzPayHostedCheckoutPage.jsx
          grep -F '"expires_in": BARCODE_VALIDITY_SECONDS' backend/routes/pos_payments.py
          grep -F '"rotation_seconds": BARCODE_VALIDITY_SECONDS' backend/routes/pos_payments.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production frontend
        working-directory: frontend
        env:
          CI: 'false'
          GENERATE_SOURCEMAP: 'false'
          REACT_APP_BACKEND_URL: ${{ secrets.PROD_REACT_APP_BACKEND_URL || 'https://bidblitz.ae' }}
          REACT_APP_MAPBOX_TOKEN: ${{ secrets.PROD_REACT_APP_MAPBOX_TOKEN }}
          REACT_APP_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PROD_STRIPE_PUBLISHABLE_KEY || secrets.PROD_REACT_APP_STRIPE_PUBLISHABLE_KEY }}
          REACT_APP_TEST_MODE: 'false'
        run: |
          set -euo pipefail
          export BUILD_ID="$(git rev-parse --short HEAD)-$(date -u +%Y%m%d%H%M%S)"
          cat > .env <<EOF
          REACT_APP_BACKEND_URL=${REACT_APP_BACKEND_URL}
          REACT_APP_MAPBOX_TOKEN=${REACT_APP_MAPBOX_TOKEN}
          REACT_APP_STRIPE_PUBLISHABLE_KEY=${REACT_APP_STRIPE_PUBLISHABLE_KEY}
          REACT_APP_TEST_MODE=false
          REACT_APP_BUILD_ID=${BUILD_ID}
          EOF
          npm run build
          test -s build/index.html
          test -s build/version.json
          test -s build/service-worker.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          version = json.loads(Path("build/version.json").read_text())
          assert version["git_commit"] == "c9fdfbda836cef28fea7eebb28c02ceefdcceeac", version
          print("Built payment frontend:", version["build_id"])
          PY

      - name: Validate payment backend source
        run: |
          set -euo pipefail
          python3 -m py_compile backend/routes/pos_payments.py
          grep -F '@router.get("/my-barcode")' backend/routes/pos_payments.py
          grep -F '@router.post("/refresh-barcode")' backend/routes/pos_payments.py
          grep -F '@router.post("/barcode-pay")' backend/routes/pos_payments.py
          grep -F 'Externe Karten-/NFC-Zahlung ist in diesem Endpoint nicht provider-verifiziert' backend/routes/pos_payments.py

      - name: Package targeted release
        run: |
          set -euo pipefail
          tar -C frontend/build -czf /tmp/bidblitz-payment-frontend.tgz .
          cp backend/routes/pos_payments.py /tmp/bidblitz-pos-payments.py

      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Upload targeted release
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e scp -o StrictHostKeyChecking=no \
            /tmp/bidblitz-payment-frontend.tgz \
            /tmp/bidblitz-pos-payments.py \
            root@212.227.20.190:/tmp/

      - name: Atomically activate payment fixes
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@212.227.20.190 'bash -s' <<'REMOTE'
          set -euo pipefail
          BACKEND=/var/www/bidblitz/backend
          FRONTEND=/var/www/bidblitz/frontend
          PY="$BACKEND/venv/bin/python"
          test -x "$PY"
          test -f "$BACKEND/routes/pos_payments.py"
          pm2 describe api >/dev/null
          nginx -t

          STAMP=$(date -u +%Y%m%d%H%M%S)
          BACKUP="/var/www/bidblitz/payment-hardening-backup-$STAMP"
          OLD_FRONTEND="$FRONTEND/build.previous.$STAMP"
          NEW_FRONTEND="$FRONTEND/build.new"
          mkdir -p "$BACKUP"
          cp -p "$BACKEND/routes/pos_payments.py" "$BACKUP/pos_payments.py"

          rm -rf "$NEW_FRONTEND"
          mkdir -p "$NEW_FRONTEND"
          tar -xzf /tmp/bidblitz-payment-frontend.tgz -C "$NEW_FRONTEND"
          test -s "$NEW_FRONTEND/index.html"
          test -s "$NEW_FRONTEND/version.json"
          test -s "$NEW_FRONTEND/service-worker.js"

          cp /tmp/bidblitz-pos-payments.py "$BACKUP/pos_payments.py.new"
          "$PY" -m py_compile "$BACKUP/pos_payments.py.new"

          backend_swapped=0
          frontend_swapped=0
          rollback() {
            result=$?
            trap - ERR
            if [ "$backend_swapped" = "1" ]; then
              cp -p "$BACKUP/pos_payments.py" "$BACKEND/routes/pos_payments.py"
              pm2 restart api >/dev/null || true
            fi
            if [ "$frontend_swapped" = "1" ]; then
              rm -rf "$FRONTEND/build.failed.$STAMP"
              if [ -d "$FRONTEND/build" ]; then mv "$FRONTEND/build" "$FRONTEND/build.failed.$STAMP"; fi
              if [ -d "$OLD_FRONTEND" ]; then mv "$OLD_FRONTEND" "$FRONTEND/build"; fi
              systemctl reload nginx || true
            fi
            echo "Payment deploy rolled back; backup: $BACKUP"
            exit "$result"
          }
          trap rollback ERR

          install -m 644 /tmp/bidblitz-pos-payments.py "$BACKEND/routes/pos_payments.py"
          backend_swapped=1
          pm2 restart api

          api_ready=0
          for attempt in $(seq 1 30); do
            code="$(curl -sS -o /tmp/pay-auth-check.json -w '%{http_code}' --max-time 10 http://127.0.0.1:8001/api/payments/my-barcode || true)"
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              api_ready=1
              break
            fi
            sleep 2
          done
          test "$api_ready" = 1

          if [ -d "$FRONTEND/build" ]; then mv "$FRONTEND/build" "$OLD_FRONTEND"; fi
          mv "$NEW_FRONTEND" "$FRONTEND/build"
          frontend_swapped=1
          chown -R www-data:www-data "$FRONTEND/build"
          nginx -t
          systemctl reload nginx

          curl -fsS --retry 8 --retry-delay 2 https://bidblitz.ae/ >/dev/null
          trap - ERR
          rm -f /tmp/bidblitz-payment-frontend.tgz /tmp/bidblitz-pos-payments.py /tmp/pay-auth-check.json
          echo "Payment hardening activated; backup: $BACKUP; previous frontend: $OLD_FRONTEND"
          REMOTE

      - name: Verify live version and payment routes
        run: |
          set -euo pipefail
          stamp=$(date +%s)
          curl -fsS --retry 8 --retry-delay 2 "https://bidblitz.ae/version.json?deploy=$stamp" -o /tmp/live-version.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          actual = json.loads(Path("/tmp/live-version.json").read_text())
          assert actual["git_commit"] == "c9fdfbda836cef28fea7eebb28c02ceefdcceeac", actual
          print("Verified live frontend:", actual["build_id"])
          PY

          check_auth_route() {
            method="$1"
            url="$2"
            code="$(curl -sS -o /tmp/route-check.json -w '%{http_code}' -X "$method"               -H 'Content-Type: application/json'               --data '{}'               "$url")"
            test "$code" = "401" -o "$code" = "403" -o "$code" = "422"
            echo "$method $url -> $code"
          }

          check_auth_route GET https://bidblitz.ae/api/payments/my-barcode
          check_auth_route POST https://bidblitz.ae/api/payments/refresh-barcode
          check_auth_route POST https://bidblitz.ae/api/payments/barcode-lookup
          check_auth_route POST https://bidblitz.ae/api/payments/barcode-pay
          check_auth_route POST https://bidblitz.ae/api/payments/nfc-pay
