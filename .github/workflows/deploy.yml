name: Deploy to IONOS Production

# This workflow builds the frontend in the GitHub runner and ships the
# artifacts to the VPS via rsync over SSH. The VPS itself does NOT need
# any GitHub credentials — it only needs SSH access from the runner.
#
# Required GitHub secrets:
#   VPS_HOST            -> 212.227.20.190
#   VPS_USER            -> root
#   VPS_PASSWORD        -> SSH password for root (optional if VPS_SSH_KEY is set)
#   VPS_SSH_KEY         -> SSH private key (optional if VPS_PASSWORD is set)
#
# Optional secrets (forwarded into the production frontend build):
#   PROD_REACT_APP_BACKEND_URL          (default: https://bidblitz.ae)
#   PROD_REACT_APP_MAPBOX_TOKEN
#   PROD_REACT_APP_STRIPE_PUBLISHABLE_KEY

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, Verify & Conditional Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      VPS_BACKEND_DIR: /var/www/bidblitz/backend
      VPS_FRONTEND_BUILD_DIR: /var/www/bidblitz/frontend/build

    steps:
      - name: Decide run mode
        id: run_mode
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "deploy_reason=main_branch_live_deploy" >> "$GITHUB_OUTPUT"
            echo "✅ Live-Deploy ist erlaubt: main (${GITHUB_EVENT_NAME})."
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "deploy_reason=non_main_preflight_only" >> "$GITHUB_OUTPUT"
            echo "ℹ️ ${GITHUB_REF_NAME} ist nicht main — es laufen Build + Tests, aber niemals ein Live-Deploy."
          fi

      - name: Enforce production branch guard
        if: steps.run_mode.outputs.should_deploy == 'true'
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Production deployment is only allowed from refs/heads/main."
            exit 1
          fi
          echo "✓ Production branch guard passed: ${GITHUB_REF}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          BUILD_ENVIRONMENT: production
          REACT_APP_BACKEND_URL: ${{ secrets.PROD_REACT_APP_BACKEND_URL || 'https://bidblitz.ae' }}
          REACT_APP_MAPBOX_TOKEN: ${{ secrets.PROD_REACT_APP_MAPBOX_TOKEN }}
          REACT_APP_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PROD_REACT_APP_STRIPE_PUBLISHABLE_KEY }}
          REACT_APP_TEST_MODE: "false"
          CI: "false"
        run: |
          set -euo pipefail
          BUILD_ID="$(git rev-parse --short HEAD)-$(date -u +%Y%m%d%H%M%S)"
          export BUILD_ID
          echo "$BUILD_ID" > /tmp/bidblitz_build_id.txt
          BUILD_ENVIRONMENT=production \
          BUILD_API_BASE_URL="${REACT_APP_BACKEND_URL}" \
          BUILD_PUBLIC_BASE_URL="https://bidblitz.ae" \
          BUILD_FRONTEND_VERSION="$BUILD_ID" \
          BUILD_SERVICE_WORKER_VERSION="bidblitz-static-$BUILD_ID" \
          BUILD_API_CACHE_VERSION="bidblitz-api-$BUILD_ID" \
          python3 ../scripts/generate_build_info.py
          # Write a clean production .env (overrides whatever is committed)
          cat > .env <<EOF
          REACT_APP_BACKEND_URL=${REACT_APP_BACKEND_URL}
          REACT_APP_MAPBOX_TOKEN=${REACT_APP_MAPBOX_TOKEN}
          REACT_APP_STRIPE_PUBLISHABLE_KEY=${REACT_APP_STRIPE_PUBLISHABLE_KEY}
          REACT_APP_TEST_MODE=${REACT_APP_TEST_MODE}
          REACT_APP_BUILD_ID=${BUILD_ID}
          EOF
          perl -0pi -e 's/%REACT_APP_BUILD_ID%/'"${BUILD_ID}"'/g' public/index.html
          npm run build

          test -f build/index.html
          test -f build/service-worker.js
          test -f build/version.json
          grep -F "meta name=\"bidblitz-build-version\" content=\"${BUILD_ID}\"" build/index.html
          grep -F "const EMBEDDED_BUILD_ID = '${BUILD_ID}'; // BUILD_ID_INJECTED" build/service-worker.js
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          build_id = os.environ['BUILD_ID']
          data = json.loads(Path('build/version.json').read_text())
          assert data.get('build_id') == build_id, (data.get('build_id'), build_id)
          assert data.get('frontend_version') == build_id, (data.get('frontend_version'), build_id)
          assert data.get('service_worker_build_id') == build_id, (data.get('service_worker_build_id'), build_id)
          print(f'Production build identity verified: {build_id}')
          PY

          # Inspect runtime JavaScript only. Source maps may legitimately contain
          # localhost examples from third-party library source comments.
          if grep -R --include='*.js' -E "https?://(localhost|127\.0\.0\.1)([:/]|$)|wss?://(localhost|127\.0\.0\.1)([:/]|$)" build/static/js; then
            echo "::error::localhost URL leaked into production runtime build"
            exit 1
          fi
          if grep -R --include='*.js' -E "https?://[A-Za-z0-9.-]*preview\.emergentagent\.com([:/]|$)|wss?://[A-Za-z0-9.-]*preview\.emergentagent\.com([:/]|$)" build/static/js; then
            echo "::error::preview origin leaked into production runtime build"
            exit 1
          fi
          ls -lh build/static/js/main.*.js | head -1

      - name: Pre-deployment frontend smoke checks
        run: |
          npm --workspace frontend exec -- eslint "src/**/*.{js,jsx}"
          node frontend/scripts/check-update-safety.js

      - name: Pre-deployment backend smoke checks
        run: |
          PYTHONPATH="${GITHUB_WORKSPACE}/backend" DEMO_SEED=false pytest backend/tests/test_ci_smoke.py -q

      - name: Verify deployment secrets
        if: steps.run_mode.outputs.should_deploy == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          MISSING=0
          if [ -z "${VPS_HOST}" ]; then echo "::error::VPS_HOST secret is missing or empty"; MISSING=1; fi
          if [ -z "${VPS_USER}" ]; then echo "::error::VPS_USER secret is missing or empty"; MISSING=1; fi
          if [ -z "${VPS_PASSWORD}" ] && [ -z "${VPS_SSH_KEY}" ]; then
            echo "::error::Neither VPS_PASSWORD nor VPS_SSH_KEY is configured"
            MISSING=1
          fi
          if [ "$MISSING" = "1" ]; then
            echo "::error::Open GitHub repo → Settings → Secrets and variables → Actions and add the missing secrets."
            echo "::error::Required: VPS_HOST (e.g. 212.227.20.190), VPS_USER (e.g. root), and either VPS_PASSWORD or VPS_SSH_KEY"
            exit 1
          fi
          echo "✓ All deployment secrets are present"
          echo "  VPS_HOST length: ${#VPS_HOST}"
          echo "  VPS_USER:        ${VPS_USER}"
          if [ -n "${VPS_PASSWORD}" ]; then echo "  VPS_PASSWORD:    [${#VPS_PASSWORD} chars]"; fi
          if [ -n "${VPS_SSH_KEY}" ]; then echo "  VPS_SSH_KEY:     configured"; fi

      - name: Prepare SSH auth mode
        if: steps.run_mode.outputs.should_deploy == 'true'
        id: ssh_auth
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -n "${VPS_SSH_KEY}" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/bidblitz_deploy_key
            chmod 600 ~/.ssh/bidblitz_deploy_key
            echo "auth_mode=key" >> "$GITHUB_OUTPUT"
            echo "✓ Using SSH key authentication"
          else
            echo "auth_mode=password" >> "$GITHUB_OUTPUT"
            echo "✓ Using password authentication"
          fi

      - name: Install sshpass + rsync
        if: steps.run_mode.outputs.should_deploy == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass rsync

      - name: Backup remote build & rsync new build
        if: steps.run_mode.outputs.should_deploy == 'true'
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          if [ "${{ steps.ssh_auth.outputs.auth_mode }}" = "key" ]; then
            SSH="ssh -i ~/.ssh/bidblitz_deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
            RSYNC_RSH="ssh -i ~/.ssh/bidblitz_deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          else
            SSH="sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
            RSYNC_RSH="sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          fi

          echo "==> Backup current build on VPS"
          $SSH "$VPS_USER@$VPS_HOST" "
            set -e
            TS=\$(date +%Y%m%d_%H%M%S)
            if [ -d ${VPS_FRONTEND_BUILD_DIR} ]; then
              cp -r ${VPS_FRONTEND_BUILD_DIR} ${VPS_FRONTEND_BUILD_DIR}.bak.\$TS
              ls -1dt ${VPS_FRONTEND_BUILD_DIR}.bak.* 2>/dev/null | tail -n +6 | xargs -r rm -rf
            fi
            mkdir -p ${VPS_FRONTEND_BUILD_DIR}
          "

          echo "==> Rsync frontend build"
          rsync -az --delete -e "$RSYNC_RSH" \
            frontend/build/ "$VPS_USER@$VPS_HOST:${VPS_FRONTEND_BUILD_DIR}/"

          echo "==> Rsync backend code (preserve venv, __pycache__, .env, logs, data)"
          rsync -az -e "$RSYNC_RSH" \
            --exclude 'venv/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'logs/' \
            --exclude 'core_backup/' \
            --exclude '.pytest_cache/' \
            backend/ "$VPS_USER@$VPS_HOST:${VPS_BACKEND_DIR}/"

          echo "==> Rsync deploy scripts"
          $SSH "$VPS_USER@$VPS_HOST" "mkdir -p /var/www/bidblitz/deploy"
          rsync -az -e "$RSYNC_RSH" \
            deploy/ "$VPS_USER@$VPS_HOST:/var/www/bidblitz/deploy/"
          $SSH "$VPS_USER@$VPS_HOST" "chmod +x /var/www/bidblitz/deploy/*.sh 2>/dev/null || true"

      - name: Sync MAPBOX_TOKEN into backend .env on VPS (password)
        if: steps.run_mode.outputs.should_deploy == 'true' && steps.ssh_auth.outputs.auth_mode == 'password'
        uses: appleboy/ssh-action@v1.0.3
        env:
          MAPBOX_TOKEN_VALUE: ${{ secrets.PROD_REACT_APP_MAPBOX_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          command_timeout: 1m
          envs: MAPBOX_TOKEN_VALUE
          script: |
            set -e
            cd /var/www/bidblitz/backend
            if [ -z "${MAPBOX_TOKEN_VALUE}" ]; then
              echo "::warning::PROD_REACT_APP_MAPBOX_TOKEN secret is empty — backend MAPBOX_TOKEN not synced. Set it under Settings → Secrets → Actions to enable server-side geocoding/routing."
              exit 0
            fi
            if [ ! -f .env ]; then
              echo "::error::/var/www/bidblitz/backend/.env missing — cannot sync MAPBOX_TOKEN"
              exit 1
            fi
            if grep -q '^MAPBOX_TOKEN=' .env; then
              sed -i "s|^MAPBOX_TOKEN=.*|MAPBOX_TOKEN=${MAPBOX_TOKEN_VALUE}|" .env
              echo "✓ MAPBOX_TOKEN updated in backend/.env"
            else
              echo "MAPBOX_TOKEN=${MAPBOX_TOKEN_VALUE}" >> .env
              echo "✓ MAPBOX_TOKEN appended to backend/.env"
            fi

      - name: Sync MAPBOX_TOKEN into backend .env on VPS (key)
        if: steps.run_mode.outputs.should_deploy == 'true' && steps.ssh_auth.outputs.auth_mode == 'key'
        uses: appleboy/ssh-action@v1.0.3
        env:
          MAPBOX_TOKEN_VALUE: ${{ secrets.PROD_REACT_APP_MAPBOX_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 1m
          envs: MAPBOX_TOKEN_VALUE
          script: |
            set -e
            cd /var/www/bidblitz/backend
            if [ -z "${MAPBOX_TOKEN_VALUE}" ]; then
              echo "::warning::PROD_REACT_APP_MAPBOX_TOKEN secret is empty — backend MAPBOX_TOKEN not synced. Set it under Settings → Secrets → Actions to enable server-side geocoding/routing."
              exit 0
            fi
            if [ ! -f .env ]; then
              echo "::error::/var/www/bidblitz/backend/.env missing — cannot sync MAPBOX_TOKEN"
              exit 1
            fi
            if grep -q '^MAPBOX_TOKEN=' .env; then
              sed -i "s|^MAPBOX_TOKEN=.*|MAPBOX_TOKEN=${MAPBOX_TOKEN_VALUE}|" .env
              echo "✓ MAPBOX_TOKEN updated in backend/.env"
            else
              echo "MAPBOX_TOKEN=${MAPBOX_TOKEN_VALUE}" >> .env
              echo "✓ MAPBOX_TOKEN appended to backend/.env"
            fi

      - name: Install backend deps & restart services (password)
        if: steps.run_mode.outputs.should_deploy == 'true' && steps.ssh_auth.outputs.auth_mode == 'password'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /var/www/bidblitz/backend

            echo "==> Ensure .env exists (preserve existing one)"
            if [ ! -f .env ]; then
              echo "ERROR: /var/www/bidblitz/backend/.env missing — backend cannot start without MONGO_URL"
              echo "Create it manually with MONGO_URL, DB_NAME, JWT_SECRET, etc."
              exit 1
            fi

            echo "==> Backend deps"
            if [ ! -d venv ]; then python3 -m venv venv; fi
            source venv/bin/activate
            pip install -q --upgrade pip
            pip install --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/ -r requirements.txt

            echo "==> Pre-boot import validation (catch ImportError before PM2 restart)"
            if ! python -c "import sys; sys.path.insert(0, '.'); from server import app; print(f'IMPORT_OK: {len(app.routes)} routes')"; then
              echo "::error::Backend import failed — aborting deploy. Old version stays live."
              deactivate
              exit 1
            fi
            deactivate

            echo "==> Clean PM2 restart (delete + start to guarantee fresh args)"
            pm2 delete api 2>/dev/null || true
            pm2 start venv/bin/uvicorn \
              --name api \
              --interpreter none \
              --cwd /var/www/bidblitz/backend \
              -- server:app --host 127.0.0.1 --port 8001 --workers 1
            pm2 save

            echo "==> Wait up to 60s for port 8001 to become listening"
            PORT_OK=0
            for i in $(seq 1 30); do
              if ss -tlnp 2>/dev/null | grep -q ':8001'; then
                echo "  -> port 8001 listening after ${i}*2=$((i*2))s"
                PORT_OK=1
                break
              fi
              sleep 2
            done
            if [ "$PORT_OK" != "1" ]; then
              echo "::error::Port 8001 NOT listening after 60s — dumping logs"
              pm2 logs api --lines 100 --nostream
              exit 1
            fi

            echo "==> Backend status"
            pm2 list | grep -E '\bapi\b'
            pm2 logs api --lines 30 --nostream || true

            echo "==> Reload nginx"
            nginx -t && systemctl reload nginx

            echo "==> Bust old live caches"
            find /var/www/bidblitz/frontend/build/static/js -maxdepth 1 -type f -name 'main.*.js' | sort
            find /var/www/bidblitz/frontend/build/static/css -maxdepth 1 -type f -name 'main.*.css' | sort || true

            echo "==> Health checks"
            curl -fsS -o /dev/null -w 'WEB  HTTP %{http_code}\n' https://bidblitz.ae/ || true
            curl -fsS https://bidblitz.ae/api/system/version | tee /tmp/bidblitz-live-version.json
            HEALTH=$(curl -s -o /dev/null -w '%{http_code}' https://bidblitz.ae/api/auctions || echo "ERR")
            echo "API  HTTP ${HEALTH}"
            if [ "$HEALTH" = "502" ] || [ "$HEALTH" = "ERR" ]; then
              echo "BACKEND STILL DOWN — dumping logs"
              pm2 logs api --lines 100 --nostream
              exit 1
            fi
            echo "==> Mapbox token health"
            MB=$(curl -s 'https://bidblitz.ae/api/readiness/mapbox-token?live=true' || echo '{}')
            echo "  $MB"
            ls -lh /var/www/bidblitz/frontend/build/static/js/main.*.js | head -1
            curl -fsS https://bidblitz.ae/ | grep -o 'bidblitz-build-version' | head -1
            python3 - <<'PY'
            import json
            from pathlib import Path
            v=Path('/tmp/bidblitz-live-version.json')
            if v.exists():
                data=json.loads(v.read_text())
                print('LIVE_BUILD_ID', data.get('build_id'))
                print('LIVE_COMMIT', data.get('git_commit'))
            PY

      - name: Install backend deps & restart services (key)
        if: steps.run_mode.outputs.should_deploy == 'true' && steps.ssh_auth.outputs.auth_mode == 'key'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /var/www/bidblitz/backend

            echo "==> Ensure .env exists (preserve existing one)"
            if [ ! -f .env ]; then
              echo "ERROR: /var/www/bidblitz/backend/.env missing — backend cannot start without MONGO_URL"
              echo "Create it manually with MONGO_URL, DB_NAME, JWT_SECRET, etc."
              exit 1
            fi

            echo "==> Backend deps"
            if [ ! -d venv ]; then python3 -m venv venv; fi
            source venv/bin/activate
            pip install -q --upgrade pip
            pip install --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/ -r requirements.txt

            echo "==> Pre-boot import validation (catch ImportError before PM2 restart)"
            if ! python -c "import sys; sys.path.insert(0, '.'); from server import app; print(f'IMPORT_OK: {len(app.routes)} routes')"; then
              echo "::error::Backend import failed — aborting deploy. Old version stays live."
              deactivate
              exit 1
            fi
            deactivate

            echo "==> Clean PM2 restart (delete + start to guarantee fresh args)"
            pm2 delete api 2>/dev/null || true
            pm2 start venv/bin/uvicorn \
              --name api \
              --interpreter none \
              --cwd /var/www/bidblitz/backend \
              -- server:app --host 127.0.0.1 --port 8001 --workers 1
            pm2 save

            echo "==> Wait up to 60s for port 8001 to become listening"
            PORT_OK=0
            for i in $(seq 1 30); do
              if ss -tlnp 2>/dev/null | grep -q ':8001'; then
                echo "  -> port 8001 listening after ${i}*2=$((i*2))s"
                PORT_OK=1
                break
              fi
              sleep 2
            done
            if [ "$PORT_OK" != "1" ]; then
              echo "::error::Port 8001 NOT listening after 60s — dumping logs"
              pm2 logs api --lines 100 --nostream
              exit 1
            fi

            echo "==> Backend status"
            pm2 list | grep -E '\bapi\b'
            pm2 logs api --lines 30 --nostream || true

            echo "==> Reload nginx"
            nginx -t && systemctl reload nginx

            echo "==> Bust old live caches"
            find /var/www/bidblitz/frontend/build/static/js -maxdepth 1 -type f -name 'main.*.js' | sort
            find /var/www/bidblitz/frontend/build/static/css -maxdepth 1 -type f -name 'main.*.css' | sort || true

            echo "==> Health checks"
            curl -fsS -o /dev/null -w 'WEB  HTTP %{http_code}\n' https://bidblitz.ae/ || true
            curl -fsS https://bidblitz.ae/api/system/version | tee /tmp/bidblitz-live-version.json
            HEALTH=$(curl -s -o /dev/null -w '%{http_code}' https://bidblitz.ae/api/auctions || echo "ERR")
            echo "API  HTTP ${HEALTH}"
            if [ "$HEALTH" = "502" ] || [ "$HEALTH" = "ERR" ]; then
              echo "BACKEND STILL DOWN — dumping logs"
              pm2 logs api --lines 100 --nostream
              exit 1
            fi
            echo "==> Mapbox token health"
            MB=$(curl -s 'https://bidblitz.ae/api/readiness/mapbox-token?live=true' || echo '{}')
            echo "  $MB"
            ls -lh /var/www/bidblitz/frontend/build/static/js/main.*.js | head -1
            curl -fsS https://bidblitz.ae/ | grep -o 'bidblitz-build-version' | head -1
            python3 - <<'PY'
            import json
            from pathlib import Path
            v=Path('/tmp/bidblitz-live-version.json')
            if v.exists():
                data=json.loads(v.read_text())
                print('LIVE_BUILD_ID', data.get('build_id'))
                print('LIVE_COMMIT', data.get('git_commit'))
            PY

      - name: Branch run summary
        if: steps.run_mode.outputs.should_deploy != 'true'
        run: |
          echo "::notice::Build + Smoke-Checks erfolgreich. Live-Deploy wurde absichtlich übersprungen, weil dieser Run nicht auf main läuft."
          echo "::notice::Für einen echten Deploy zuerst nach main mergen und workflow_dispatch nur auf main starten."

      - name: Deployment summary
        if: always()
        run: |
          if [ "${{ steps.run_mode.outputs.should_deploy }}" = "true" ]; then
            echo "::notice::Deploy finished. Verify https://bidblitz.ae"
          else
            echo "::notice::Preflight finished without live deploy."
          fi
