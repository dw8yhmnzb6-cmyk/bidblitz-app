name: Deploy to bidblitz.ae VPS

on:
  push:
    branches:
      - main
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Build Frontend
        run: |
          cd frontend
          yarn install
          yarn build
      
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Backup
            cd /var/www/bidblitz
            cp -r backend backend.backup.$(date +%Y%m%d_%H%M%S)
            cp -r frontend/build frontend/build.backup.$(date +%Y%m%d_%H%M%S)
            
            # Pull latest code
            git pull origin main
            
            # Install backend dependencies
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt
            
            # Copy frontend build
            cd ../frontend
            yarn install
            yarn build
            
            # Restart services
            sudo systemctl restart bidblitz-backend
            sudo nginx -s reload
            
            echo "✅ Deployment completed!"
      
      - name: Notify Deployment Status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment to bidblitz.ae successful!"
          else
            echo "❌ Deployment failed!"
          fi
