name: One-time Apple Google Pay Server Diagnose

on:
  push:
    branches:
      - work/cache-update-hardening
    paths:
      - .github/workflows/diagnose-apple-google-pay-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Inspect live router registry block
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@212.227.20.190 'bash -s' <<'REMOTE'
          set -euo pipefail
          BACKEND=/var/www/bidblitz/backend
          echo "=== REGISTRY CORE BLOCK ==="
          sed -n '28,55p' "$BACKEND/core/router_registry.py"
          echo "=== STRIPE ANCHOR COUNT ==="
          grep -F -c '("routes.stripe", "router"),' "$BACKEND/core/router_registry.py" || true
          echo "=== APPLE GOOGLE COUNT ==="
          grep -F -c '("routes.apple_google_pay", "router"),' "$BACKEND/core/router_registry.py" || true
          REMOTE
