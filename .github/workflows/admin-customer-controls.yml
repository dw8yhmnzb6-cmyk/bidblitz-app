name: Inspect current admin repair baseline
on:
  push:
    branches: [work/admin-customer-controls-20261004]
    paths: [.github/workflows/admin-customer-controls.yml]
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Existing authenticated read-only deployment connection
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo '212.227.20.190 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDKptYyzslhxZrCw9Sw6geiaiIhalloP+wIAI7IMlNVA' > ~/.ssh/known_hosts
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          SSH=(ssh -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=15)
          if [ -n "$DEPLOY_KEY" ]; then
            printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/admin_key
            chmod 600 ~/.ssh/admin_key
            SSH+=(-i ~/.ssh/admin_key -o BatchMode=yes)
          else
            SSH=(sshpass -e "${SSH[@]}")
          fi
          "${SSH[@]}" root@212.227.20.190 'python3 - << "PY"
          import json,hashlib,pathlib,subprocess
          root=pathlib.Path("/var/www/bidblitz")
          print("CURRENT_FRONTEND_VERSION", (root/"frontend/build/version.json").read_text())
          for path in ["backend/core/admin_project_access.py","backend/routes/admin_projects.py","backend/routes/admin_management.py","backend/routes/admin_wallet.py"]:
              p=root/path
              print("SOURCE_DIGEST",path,hashlib.sha256(p.read_bytes()).hexdigest())
          print("CURRENT_SOURCE_HEAD",subprocess.check_output(["git","-C",str(root),"rev-parse","HEAD"],text=True).strip())
          print("CURRENT_UI_DIGEST", hashlib.sha256((root/"frontend/build/index.html").read_bytes()).hexdigest())
          PY'
