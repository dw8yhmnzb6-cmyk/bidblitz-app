name: Deploy to bidblitz.ae

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Build Frontend
        run: |
          cd frontend
          yarn install --frozen-lockfile
          yarn build
      
      - name: Create Deployment Package
        run: |
          tar -czf deploy.tar.gz \
            --exclude='backend/__pycache__' \
            --exclude='backend/**/__pycache__' \
            --exclude='backend/venv' \
            --exclude='backend/.env' \
            --exclude='backend/logs' \
            frontend/build backend
      
      - name: Deploy to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "/tmp/"
      
      - name: Execute Deployment on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Backup
            BACKUP_DIR="/var/www/bidblitz-backups"
            mkdir -p "$BACKUP_DIR"
            BACKUP_NAME="backup_$(date +%Y%m%d_%H%M%S)"
            
            if [ -d "/var/www/bidblitz/backend" ]; then
              cp -r /var/www/bidblitz/backend "$BACKUP_DIR/$BACKUP_NAME-backend"
            fi
            if [ -d "/var/www/bidblitz/frontend/build" ]; then
              cp -r /var/www/bidblitz/frontend/build "$BACKUP_DIR/$BACKUP_NAME-frontend"
            fi
            
            # Extract
            cd /var/www/bidblitz
            tar -xzf /tmp/deploy.tar.gz
            
            # Install backend deps
            cd backend
            if [ -d "venv" ]; then
              source venv/bin/activate
              pip install -r requirements.txt -q
            fi
            
            # Restart services
            sudo systemctl restart bidblitz-backend || sudo supervisorctl restart bidblitz-backend
            sudo nginx -s reload
            
            # Cleanup
            rm /tmp/deploy.tar.gz
            
            echo "✅ Deployment completed!"
      
      - name: Notify Success
        if: success()
        run: echo "✅ Successfully deployed to bidblitz.ae"
      
      - name: Notify Failure
        if: failure()
        run: echo "❌ Deployment failed"
