name: Trade BidBlitz Core CI

on:
  push:
    paths:
      - 'backend/trade_core/**'
      - 'backend/tests/test_trade_core_*.py'
      - 'backend/requirements.txt'
      - '.github/workflows/trade-core-ci.yml'
  pull_request:
    paths:
      - 'backend/trade_core/**'
      - 'backend/tests/test_trade_core_*.py'
      - 'backend/requirements.txt'
      - '.github/workflows/trade-core-ci.yml'

jobs:
  trade-core-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install trade-core test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            SQLAlchemy==2.0.52 \
            asyncpg==0.31.0 \
            alembic==1.19.2 \
            pytest==9.0.2

      - name: Run trade-core foundation tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: pytest -q backend/tests/test_trade_core_db_foundation.py
