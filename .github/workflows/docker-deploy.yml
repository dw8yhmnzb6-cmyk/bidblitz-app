name: Deploy to Production (Docker)

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/bidblitz
            
            # Pull latest code
            git pull origin main
            
            # Update .env if needed (keeps existing values)
            if [ -f .env.production ]; then
              # Merge new env vars while keeping secrets
              echo "✅ Environment variables preserved"
            fi
            
            # Rebuild and restart containers
            docker-compose down
            docker-compose build --no-cache
            docker-compose up -d
            
            # Wait for services
            sleep 10
            
            # Health check
            if curl -f https://bidblitz.ae/health; then
              echo "✅ Deployment successful!"
            else
              echo "❌ Health check failed"
              docker-compose logs
              exit 1
            fi
      
      - name: Notify on success
        if: success()
        run: |
          echo "✅ BidBlitz deployed successfully to production!"
          echo "🌐 https://bidblitz.ae"
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed - check logs above"
