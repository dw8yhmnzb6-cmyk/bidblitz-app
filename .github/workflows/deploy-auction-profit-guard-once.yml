name: One-time Auction Profit Guard Live Deploy

on:
  push:
    branches:
      - work/cache-update-hardening
    paths:
      - .github/workflows/deploy-auction-profit-guard-once.yml

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-auction-profit-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact tested source
        uses: actions/checkout@v4
        with:
          ref: f2f159442eb58c1bb98afa93aa393d224a9de452
          fetch-depth: 0

      - name: Verify targeted application delta
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f2f159442eb58c1bb98afa93aa393d224a9de452"
          changed="$(git diff --name-only 83c3047ee3d4858d37f5074d17e6937608178067 f2f159442eb58c1bb98afa93aa393d224a9de452 -- backend/routes frontend/src | sort)"
          printf '%s\n' "$changed"
          expected="$(printf '%s\n' \
            backend/routes/auctions.py \
            frontend/src/components/auctions/AuctionDetail.jsx \
            frontend/src/components/auctions/AuctionGridCard.jsx \
            frontend/src/pages/AuctionAdminPage.jsx | sort)"
          test "$changed" = "$expected"
          grep -F 'def _profit_guard_snapshot' backend/routes/auctions.py
          grep -F 'PROFIT_GUARD_EXTENSION_SECONDS = 600' backend/routes/auctions.py
          grep -F '"starting_price": 0.01' backend/routes/auctions.py
          grep -F 'Nur echte bezahlte Kundengebote zählen.' frontend/src/pages/AuctionAdminPage.jsx
          grep -F 'Mindestziel noch nicht erreicht' frontend/src/components/auctions/AuctionDetail.jsx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production frontend
        working-directory: frontend
        env:
          CI: 'false'
          GENERATE_SOURCEMAP: 'false'
          REACT_APP_BACKEND_URL: ${{ secrets.PROD_REACT_APP_BACKEND_URL || 'https://bidblitz.ae' }}
          REACT_APP_MAPBOX_TOKEN: ${{ secrets.PROD_REACT_APP_MAPBOX_TOKEN }}
          REACT_APP_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PROD_STRIPE_PUBLISHABLE_KEY || secrets.PROD_REACT_APP_STRIPE_PUBLISHABLE_KEY }}
          REACT_APP_TEST_MODE: 'false'
        run: |
          set -euo pipefail
          export BUILD_ID="$(git rev-parse --short HEAD)-$(date -u +%Y%m%d%H%M%S)"
          cat > .env <<EOF
          REACT_APP_BACKEND_URL=${REACT_APP_BACKEND_URL}
          REACT_APP_MAPBOX_TOKEN=${REACT_APP_MAPBOX_TOKEN}
          REACT_APP_STRIPE_PUBLISHABLE_KEY=${REACT_APP_STRIPE_PUBLISHABLE_KEY}
          REACT_APP_TEST_MODE=false
          REACT_APP_BUILD_ID=${BUILD_ID}
          EOF
          npm run build
          test -s build/index.html
          test -s build/version.json
          test -s build/service-worker.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          version = json.loads(Path("build/version.json").read_text())
          assert version["git_commit"] == "f2f159442eb58c1bb98afa93aa393d224a9de452", version
          print("Built targeted frontend:", version["build_id"])
          PY

      - name: Validate backend source
        run: |
          set -euo pipefail
          python3 -m py_compile backend/routes/auctions.py
          grep -F 'Bots dürfen in Production nur auf klar markierten bot_only' backend/routes/auctions.py
          grep -F 'Bot-Strategien sind in Production nur für bot_only' backend/routes/auctions.py

      - name: Package targeted release
        run: |
          set -euo pipefail
          tar -C frontend/build -czf /tmp/bidblitz-auction-profit-frontend.tgz .
          cp backend/routes/auctions.py /tmp/bidblitz-auctions.py

      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Upload targeted release
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e scp -o StrictHostKeyChecking=no \
            /tmp/bidblitz-auction-profit-frontend.tgz \
            /tmp/bidblitz-auctions.py \
            root@212.227.20.190:/tmp/

      - name: Atomically activate auction profit guard
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@212.227.20.190 'bash -s' <<'REMOTE'
          set -euo pipefail
          BACKEND=/var/www/bidblitz/backend
          FRONTEND=/var/www/bidblitz/frontend
          PY="$BACKEND/venv/bin/python"
          test -x "$PY"
          test -f "$BACKEND/routes/auctions.py"
          pm2 describe api >/dev/null
          nginx -t

          STAMP=$(date -u +%Y%m%d%H%M%S)
          BACKUP="/var/www/bidblitz/auction-profit-backup-$STAMP"
          OLD_FRONTEND="$FRONTEND/build.previous.$STAMP"
          NEW_FRONTEND="$FRONTEND/build.new"
          mkdir -p "$BACKUP"
          cp -p "$BACKEND/routes/auctions.py" "$BACKUP/auctions.py"
          rm -rf "$NEW_FRONTEND"
          mkdir -p "$NEW_FRONTEND"
          tar -xzf /tmp/bidblitz-auction-profit-frontend.tgz -C "$NEW_FRONTEND"
          test -s "$NEW_FRONTEND/index.html"
          test -s "$NEW_FRONTEND/version.json"
          test -s "$NEW_FRONTEND/service-worker.js"
          cp /tmp/bidblitz-auctions.py "$BACKUP/auctions.py.new"
          "$PY" -m py_compile "$BACKUP/auctions.py.new"

          backend_swapped=0
          frontend_swapped=0
          rollback() {
            result=$?
            trap - ERR
            if [ "$backend_swapped" = "1" ]; then
              cp -p "$BACKUP/auctions.py" "$BACKEND/routes/auctions.py"
              pm2 restart api >/dev/null || true
            fi
            if [ "$frontend_swapped" = "1" ]; then
              rm -rf "$FRONTEND/build.failed.$STAMP"
              if [ -d "$FRONTEND/build" ]; then mv "$FRONTEND/build" "$FRONTEND/build.failed.$STAMP"; fi
              if [ -d "$OLD_FRONTEND" ]; then mv "$OLD_FRONTEND" "$FRONTEND/build"; fi
              systemctl reload nginx || true
            fi
            echo "Auction profit guard deploy rolled back; backup: $BACKUP"
            exit "$result"
          }
          trap rollback ERR

          install -m 644 /tmp/bidblitz-auctions.py "$BACKEND/routes/auctions.py"
          backend_swapped=1
          pm2 restart api

          api_ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 http://127.0.0.1:8001/api/auctions/list?status=active\&limit=1 >/tmp/auction-live-check.json; then
              api_ready=1
              break
            fi
            sleep 2
          done
          test "$api_ready" = 1

          if [ -d "$FRONTEND/build" ]; then mv "$FRONTEND/build" "$OLD_FRONTEND"; fi
          mv "$NEW_FRONTEND" "$FRONTEND/build"
          frontend_swapped=1
          chown -R www-data:www-data "$FRONTEND/build"
          nginx -t
          systemctl reload nginx

          curl -fsS --retry 8 --retry-delay 2 https://bidblitz.ae/ >/dev/null
          curl -fsS --retry 8 --retry-delay 2 'https://bidblitz.ae/api/auctions/list?status=active&limit=1' >/tmp/public-auctions.json

          trap - ERR
          rm -f /tmp/bidblitz-auction-profit-frontend.tgz /tmp/bidblitz-auctions.py /tmp/auction-live-check.json /tmp/public-auctions.json
          echo "Auction profit guard activated; backup: $BACKUP; previous frontend: $OLD_FRONTEND"
          REMOTE

      - name: Verify live frontend version
        run: |
          set -euo pipefail
          stamp=$(date +%s)
          curl -fsS --retry 8 --retry-delay 2 "https://bidblitz.ae/version.json?deploy=$stamp" -o /tmp/live-version.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          actual = json.loads(Path("/tmp/live-version.json").read_text())
          assert actual["git_commit"] == "f2f159442eb58c1bb98afa93aa393d224a9de452", actual
          print("Verified live frontend:", actual["build_id"])
          PY
          curl -fsS --retry 8 --retry-delay 2 'https://bidblitz.ae/api/auctions/list?status=active&limit=1' >/dev/null
