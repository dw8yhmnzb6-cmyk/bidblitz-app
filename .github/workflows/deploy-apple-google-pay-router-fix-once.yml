name: One-time Apple Google Pay Router Fix Live Deploy

on:
  push:
    branches:
      - work/cache-update-hardening
    paths:
      - .github/workflows/deploy-apple-google-pay-router-fix-once.yml

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact tested source
        uses: actions/checkout@v4
        with:
          ref: bc4c98b51fc54dd5441046786fa7602d2f696921
          fetch-depth: 0

      - name: Verify tested source contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "bc4c98b51fc54dd5441046786fa7602d2f696921"
          grep -F '("routes.apple_google_pay", "router"),' backend/core/router_registry.py
          grep -F '@router.get("/payment-request-capabilities")' backend/routes/apple_google_pay.py
          grep -F '"apple_google_pay_enabled": provider_configured and settlement_webhook_configured' backend/routes/apple_google_pay.py
          grep -F '/api/payments/payment-request-capabilities' frontend/src/components/AppleGooglePayButton.jsx
          grep -F 'readiness?.apple_google_pay_enabled' frontend/src/components/AppleGooglePayButton.jsx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production frontend
        working-directory: frontend
        env:
          CI: 'false'
          GENERATE_SOURCEMAP: 'false'
          REACT_APP_BACKEND_URL: ${{ secrets.PROD_REACT_APP_BACKEND_URL || 'https://bidblitz.ae' }}
          REACT_APP_MAPBOX_TOKEN: ${{ secrets.PROD_REACT_APP_MAPBOX_TOKEN }}
          REACT_APP_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PROD_STRIPE_PUBLISHABLE_KEY || secrets.PROD_REACT_APP_STRIPE_PUBLISHABLE_KEY }}
          REACT_APP_TEST_MODE: 'false'
        run: |
          set -euo pipefail
          export BUILD_ID="$(git rev-parse --short HEAD)-$(date -u +%Y%m%d%H%M%S)"
          cat > .env <<EOF
          REACT_APP_BACKEND_URL=${REACT_APP_BACKEND_URL}
          REACT_APP_MAPBOX_TOKEN=${REACT_APP_MAPBOX_TOKEN}
          REACT_APP_STRIPE_PUBLISHABLE_KEY=${REACT_APP_STRIPE_PUBLISHABLE_KEY}
          REACT_APP_TEST_MODE=false
          REACT_APP_BUILD_ID=${BUILD_ID}
          EOF
          npm run build
          test -s build/index.html
          test -s build/version.json
          test -s build/service-worker.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("build/version.json").read_text())
          assert d["git_commit"] == "bc4c98b51fc54dd5441046786fa7602d2f696921", d
          print("build_id", d["build_id"])
          PY

      - name: Validate route module
        run: python3 -m py_compile backend/routes/apple_google_pay.py

      - name: Package release
        run: |
          tar -C frontend/build -czf /tmp/bidblitz-apple-google-router-fix.tgz .
          cp backend/routes/apple_google_pay.py /tmp/apple_google_pay.py

      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Upload release
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e scp -o StrictHostKeyChecking=no             /tmp/bidblitz-apple-google-router-fix.tgz             /tmp/apple_google_pay.py             root@212.227.20.190:/tmp/

      - name: Activate route registry and payment readiness
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@212.227.20.190 'bash -s' <<'REMOTE'
          set -euo pipefail
          BACKEND=/var/www/bidblitz/backend
          FRONTEND=/var/www/bidblitz/frontend
          PY="$BACKEND/venv/bin/python"
          REGISTRY="$BACKEND/core/router_registry.py"
          ROUTE="$BACKEND/routes/apple_google_pay.py"
          STAMP=$(date -u +%Y%m%d%H%M%S)
          BACKUP="/var/www/bidblitz/apple-google-router-backup-$STAMP"
          OLD_FRONTEND="$FRONTEND/build.previous.$STAMP"
          NEW_FRONTEND="$FRONTEND/build.new"

          test -x "$PY"
          test -f "$REGISTRY"
          test -f "$ROUTE"
          pm2 describe api >/dev/null
          nginx -t

          mkdir -p "$BACKUP"
          cp -p "$REGISTRY" "$BACKUP/router_registry.py"
          cp -p "$ROUTE" "$BACKUP/apple_google_pay.py"

          rm -rf "$NEW_FRONTEND"
          mkdir -p "$NEW_FRONTEND"
          tar -xzf /tmp/bidblitz-apple-google-router-fix.tgz -C "$NEW_FRONTEND"
          test -s "$NEW_FRONTEND/index.html"
          test -s "$NEW_FRONTEND/version.json"
          test -s "$NEW_FRONTEND/service-worker.js"

          cp /tmp/apple_google_pay.py "$BACKUP/apple_google_pay.py.new"
          "$PY" -m py_compile "$BACKUP/apple_google_pay.py.new"

          stripe_count=$(grep -F -c '("routes.stripe", "router"),' "$REGISTRY" || true)
          apple_count=$(grep -F -c '("routes.apple_google_pay", "router"),' "$REGISTRY" || true)
          test "$stripe_count" = "1"
          test "$apple_count" = "0" -o "$apple_count" = "1"

          if [ "$apple_count" = "0" ]; then
            "$PY" - "$REGISTRY" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          anchor='        ("routes.stripe", "router"),\n'
          insert='        ("routes.stripe", "router"),\n        ("routes.apple_google_pay", "router"),\n'
          if s.count(anchor) != 1:
              raise SystemExit("stripe anchor count is not exactly one")
          if '("routes.apple_google_pay", "router"),' not in s:
              s=s.replace(anchor, insert, 1)
          p.write_text(s)
          PY
          fi

          test "$(grep -F -c '("routes.apple_google_pay", "router"),' "$REGISTRY")" = "1"
          "$PY" -m py_compile "$REGISTRY"

          backend_swapped=0
          frontend_swapped=0
          rollback() {
            result=$?
            trap - ERR
            cp -p "$BACKUP/router_registry.py" "$REGISTRY" || true
            if [ "$backend_swapped" = "1" ]; then
              cp -p "$BACKUP/apple_google_pay.py" "$ROUTE" || true
            fi
            pm2 restart api >/dev/null || true
            if [ "$frontend_swapped" = "1" ]; then
              rm -rf "$FRONTEND/build.failed.$STAMP"
              if [ -d "$FRONTEND/build" ]; then mv "$FRONTEND/build" "$FRONTEND/build.failed.$STAMP"; fi
              if [ -d "$OLD_FRONTEND" ]; then mv "$OLD_FRONTEND" "$FRONTEND/build"; fi
              systemctl reload nginx || true
            fi
            echo "Router fix rolled back; backup: $BACKUP"
            exit "$result"
          }
          trap rollback ERR

          install -m 644 /tmp/apple_google_pay.py "$ROUTE"
          backend_swapped=1
          pm2 restart api

          ready=0
          for attempt in $(seq 1 45); do
            health="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:8001/health || true)"
            cap="$(curl -sS -o /tmp/readiness.json -w '%{http_code}' --max-time 10 http://127.0.0.1:8001/api/payments/payment-request-capabilities || true)"
            if [ "$health" = "200" ] && [ "$cap" = "200" ]; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1"

          if [ -d "$FRONTEND/build" ]; then mv "$FRONTEND/build" "$OLD_FRONTEND"; fi
          mv "$NEW_FRONTEND" "$FRONTEND/build"
          frontend_swapped=1
          chown -R www-data:www-data "$FRONTEND/build"
          nginx -t
          systemctl reload nginx
          curl -fsS --retry 8 --retry-delay 2 https://bidblitz.ae/ >/dev/null

          trap - ERR
          rm -f /tmp/bidblitz-apple-google-router-fix.tgz /tmp/apple_google_pay.py /tmp/readiness.json
          echo "Apple/Google Pay router fix activated; backup: $BACKUP"
          REMOTE

      - name: Verify live payment readiness
        run: |
          set -euo pipefail
          stamp=$(date +%s)
          curl -fsS --retry 8 --retry-delay 2 "https://bidblitz.ae/version.json?deploy=$stamp" -o /tmp/version.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/version.json"))
          assert d["git_commit"] == "bc4c98b51fc54dd5441046786fa7602d2f696921", d
          print("Verified frontend:", d["build_id"])
          PY

          curl -fsS https://bidblitz.ae/api/payments/payment-request-capabilities -o /tmp/readiness.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/readiness.json"))
          assert d["currency"] == "eur", d
          assert isinstance(d["apple_google_pay_enabled"], bool), d
          assert isinstance(d["provider_configured"], bool), d
          assert isinstance(d["settlement_webhook_configured"], bool), d
          print("Readiness:", d)
          PY

          code="$(curl -sS -o /tmp/pi.json -w '%{http_code}'             -X POST -H 'Content-Type: application/json'             --data '{"amount":1,"currency":"eur"}'             https://bidblitz.ae/api/payments/create-payment-intent)"
          test "$code" = "401" -o "$code" = "403"
          echo "PaymentIntent unauthenticated -> $code"

          curl -fsS https://bidblitz.ae/api/stripe/plans -o /tmp/plans.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/plans.json"))
          ids=[str(x["package_id"]) for x in d["plans"]]
          assert ids == ["10","25","50","100","250","500"], ids
          print("Stripe plans:", ids)
          PY
