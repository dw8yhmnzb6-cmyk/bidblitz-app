name: One-time Apple Google Pay Readiness Live Deploy

on:
  push:
    branches:
      - work/cache-update-hardening
    paths:
      - .github/workflows/deploy-apple-google-pay-readiness-once.yml

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-apple-google-pay-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact tested source
        uses: actions/checkout@v4
        with:
          ref: bc4c98b51fc54dd5441046786fa7602d2f696921
          fetch-depth: 0

      - name: Verify targeted application delta
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "bc4c98b51fc54dd5441046786fa7602d2f696921"

          backend_changed="$(git diff --name-only 16c219e9a8c41d6b92542339e064fce98db233ad bc4c98b51fc54dd5441046786fa7602d2f696921 -- backend/routes | sort)"
          frontend_changed="$(git diff --name-only 16c219e9a8c41d6b92542339e064fce98db233ad bc4c98b51fc54dd5441046786fa7602d2f696921 -- frontend/src | sort)"
          printf 'Backend delta:\n%s\n' "$backend_changed"
          printf 'Frontend delta:\n%s\n' "$frontend_changed"
          test "$backend_changed" = "backend/routes/apple_google_pay.py"
          test "$frontend_changed" = "frontend/src/components/AppleGooglePayButton.jsx"

          grep -F '@router.get("/payment-request-capabilities")' backend/routes/apple_google_pay.py
          grep -F '"apple_google_pay_enabled": provider_configured and settlement_webhook_configured' backend/routes/apple_google_pay.py
          grep -F 'user = await get_current_user(request)' backend/routes/apple_google_pay.py
          grep -F '/api/payments/payment-request-capabilities' frontend/src/components/AppleGooglePayButton.jsx
          grep -F 'readiness?.apple_google_pay_enabled' frontend/src/components/AppleGooglePayButton.jsx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production frontend
        working-directory: frontend
        env:
          CI: 'false'
          GENERATE_SOURCEMAP: 'false'
          REACT_APP_BACKEND_URL: ${{ secrets.PROD_REACT_APP_BACKEND_URL || 'https://bidblitz.ae' }}
          REACT_APP_MAPBOX_TOKEN: ${{ secrets.PROD_REACT_APP_MAPBOX_TOKEN }}
          REACT_APP_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PROD_STRIPE_PUBLISHABLE_KEY || secrets.PROD_REACT_APP_STRIPE_PUBLISHABLE_KEY }}
          REACT_APP_TEST_MODE: 'false'
        run: |
          set -euo pipefail
          export BUILD_ID="$(git rev-parse --short HEAD)-$(date -u +%Y%m%d%H%M%S)"
          cat > .env <<EOF
          REACT_APP_BACKEND_URL=${REACT_APP_BACKEND_URL}
          REACT_APP_MAPBOX_TOKEN=${REACT_APP_MAPBOX_TOKEN}
          REACT_APP_STRIPE_PUBLISHABLE_KEY=${REACT_APP_STRIPE_PUBLISHABLE_KEY}
          REACT_APP_TEST_MODE=false
          REACT_APP_BUILD_ID=${BUILD_ID}
          EOF
          npm run build
          test -s build/index.html
          test -s build/version.json
          test -s build/service-worker.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          version = json.loads(Path("build/version.json").read_text())
          assert version["git_commit"] == "bc4c98b51fc54dd5441046786fa7602d2f696921", version
          print("Built Apple/Google Pay frontend:", version["build_id"])
          PY

      - name: Validate backend source
        run: |
          set -euo pipefail
          python3 -m py_compile backend/routes/apple_google_pay.py
          grep -F 'if not stripe.api_key:' backend/routes/apple_google_pay.py
          grep -F 'if not STRIPE_WEBHOOK_SECRET:' backend/routes/apple_google_pay.py
          grep -F 'currency: str = Field(default="eur", pattern="^eur$")' backend/routes/apple_google_pay.py

      - name: Package targeted release
        run: |
          set -euo pipefail
          tar -C frontend/build -czf /tmp/bidblitz-apple-google-pay-frontend.tgz .
          cp backend/routes/apple_google_pay.py /tmp/bidblitz-apple-google-pay.py

      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Upload targeted release
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e scp -o StrictHostKeyChecking=no \
            /tmp/bidblitz-apple-google-pay-frontend.tgz \
            /tmp/bidblitz-apple-google-pay.py \
            root@212.227.20.190:/tmp/

      - name: Atomically activate Apple Google Pay readiness
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@212.227.20.190 'bash -s' <<'REMOTE'
          set -euo pipefail
          BACKEND=/var/www/bidblitz/backend
          FRONTEND=/var/www/bidblitz/frontend
          PY="$BACKEND/venv/bin/python"
          test -x "$PY"
          test -f "$BACKEND/routes/apple_google_pay.py"
          pm2 describe api >/dev/null
          nginx -t

          STAMP=$(date -u +%Y%m%d%H%M%S)
          BACKUP="/var/www/bidblitz/apple-google-pay-backup-$STAMP"
          OLD_FRONTEND="$FRONTEND/build.previous.$STAMP"
          NEW_FRONTEND="$FRONTEND/build.new"
          mkdir -p "$BACKUP"
          cp -p "$BACKEND/routes/apple_google_pay.py" "$BACKUP/apple_google_pay.py"

          rm -rf "$NEW_FRONTEND"
          mkdir -p "$NEW_FRONTEND"
          tar -xzf /tmp/bidblitz-apple-google-pay-frontend.tgz -C "$NEW_FRONTEND"
          test -s "$NEW_FRONTEND/index.html"
          test -s "$NEW_FRONTEND/version.json"
          test -s "$NEW_FRONTEND/service-worker.js"

          cp /tmp/bidblitz-apple-google-pay.py "$BACKUP/apple_google_pay.py.new"
          "$PY" -m py_compile "$BACKUP/apple_google_pay.py.new"

          backend_swapped=0
          frontend_swapped=0
          rollback() {
            result=$?
            trap - ERR
            if [ "$backend_swapped" = "1" ]; then
              cp -p "$BACKUP/apple_google_pay.py" "$BACKEND/routes/apple_google_pay.py"
              pm2 restart api >/dev/null || true
            fi
            if [ "$frontend_swapped" = "1" ]; then
              rm -rf "$FRONTEND/build.failed.$STAMP"
              if [ -d "$FRONTEND/build" ]; then mv "$FRONTEND/build" "$FRONTEND/build.failed.$STAMP"; fi
              if [ -d "$OLD_FRONTEND" ]; then mv "$OLD_FRONTEND" "$FRONTEND/build"; fi
              systemctl reload nginx || true
            fi
            echo "Apple/Google Pay readiness deploy rolled back; backup: $BACKUP"
            exit "$result"
          }
          trap rollback ERR

          install -m 644 /tmp/bidblitz-apple-google-pay.py "$BACKEND/routes/apple_google_pay.py"
          backend_swapped=1
          pm2 restart api

          api_ready=0
          for attempt in $(seq 1 30); do
            code="$(curl -sS -o /tmp/readiness.json -w '%{http_code}' --max-time 10 http://127.0.0.1:8001/api/payments/payment-request-capabilities || true)"
            if [ "$code" = "200" ]; then
              api_ready=1
              break
            fi
            sleep 2
          done
          test "$api_ready" = 1

          if [ -d "$FRONTEND/build" ]; then mv "$FRONTEND/build" "$OLD_FRONTEND"; fi
          mv "$NEW_FRONTEND" "$FRONTEND/build"
          frontend_swapped=1
          chown -R www-data:www-data "$FRONTEND/build"
          nginx -t
          systemctl reload nginx
          curl -fsS --retry 8 --retry-delay 2 https://bidblitz.ae/ >/dev/null

          trap - ERR
          rm -f /tmp/bidblitz-apple-google-pay-frontend.tgz /tmp/bidblitz-apple-google-pay.py /tmp/readiness.json
          echo "Apple/Google Pay readiness activated; backup: $BACKUP; previous frontend: $OLD_FRONTEND"
          REMOTE

      - name: Verify live version and readiness
        run: |
          set -euo pipefail
          stamp=$(date +%s)
          curl -fsS --retry 8 --retry-delay 2 "https://bidblitz.ae/version.json?deploy=$stamp" -o /tmp/live-version.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          actual = json.loads(Path("/tmp/live-version.json").read_text())
          assert actual["git_commit"] == "bc4c98b51fc54dd5441046786fa7602d2f696921", actual
          print("Verified live frontend:", actual["build_id"])
          PY

          curl -fsS https://bidblitz.ae/api/payments/payment-request-capabilities -o /tmp/readiness.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/readiness.json"))
          assert d.get("currency") == "eur", d
          assert isinstance(d.get("apple_google_pay_enabled"), bool), d
          assert isinstance(d.get("provider_configured"), bool), d
          assert isinstance(d.get("settlement_webhook_configured"), bool), d
          print("Apple/Google Pay readiness:", d)
          PY

          code="$(curl -sS -o /tmp/pi-auth.json -w '%{http_code}'             -X POST -H 'Content-Type: application/json'             --data '{"amount":1,"currency":"eur"}'             https://bidblitz.ae/api/payments/create-payment-intent)"
          test "$code" = "401" -o "$code" = "403"
          echo "Unauthenticated PaymentIntent check -> $code"
