name: One-time Mining Trust Copy Live Deploy

on:
  push:
    branches:
      - work/cache-update-hardening
    paths:
      - .github/workflows/deploy-mining-trust-copy-once.yml

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-mining-trust-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact tested source
        uses: actions/checkout@v4
        with:
          ref: 83c3047ee3d4858d37f5074d17e6937608178067
          fetch-depth: 0

      - name: Verify targeted frontend delta
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "83c3047ee3d4858d37f5074d17e6937608178067"
          changed="$(git diff --name-only bd1fcf0a221b8ae0461f4291de4b85d2636c2728 83c3047ee3d4858d37f5074d17e6937608178067 -- frontend/src | sort)"
          printf '%s\n' "$changed"
          test "$changed" = "frontend/src/pages/MiningTrustPage.jsx"
          if grep -qi 'preview' frontend/src/pages/MiningTrustPage.jsx; then
            echo "::error::Preview text still exists in MiningTrustPage.jsx"
            exit 1
          fi
          grep -F 'Dubai – Originalaufnahme' frontend/src/pages/MiningTrustPage.jsx
          grep -F 'Abu Dhabi – Originalaufnahme' frontend/src/pages/MiningTrustPage.jsx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production frontend
        working-directory: frontend
        env:
          CI: 'false'
          GENERATE_SOURCEMAP: 'false'
          REACT_APP_BACKEND_URL: ${{ secrets.PROD_REACT_APP_BACKEND_URL || 'https://bidblitz.ae' }}
          REACT_APP_MAPBOX_TOKEN: ${{ secrets.PROD_REACT_APP_MAPBOX_TOKEN }}
          REACT_APP_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PROD_STRIPE_PUBLISHABLE_KEY || secrets.PROD_REACT_APP_STRIPE_PUBLISHABLE_KEY }}
          REACT_APP_TEST_MODE: 'false'
        run: |
          set -euo pipefail
          export BUILD_ID="$(git rev-parse --short HEAD)-$(date -u +%Y%m%d%H%M%S)"
          cat > .env <<EOF
          REACT_APP_BACKEND_URL=${REACT_APP_BACKEND_URL}
          REACT_APP_MAPBOX_TOKEN=${REACT_APP_MAPBOX_TOKEN}
          REACT_APP_STRIPE_PUBLISHABLE_KEY=${REACT_APP_STRIPE_PUBLISHABLE_KEY}
          REACT_APP_TEST_MODE=false
          REACT_APP_BUILD_ID=${BUILD_ID}
          EOF
          npm run build
          test -s build/index.html
          test -s build/version.json
          test -s build/service-worker.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          version = json.loads(Path("build/version.json").read_text())
          assert version["git_commit"] == "83c3047ee3d4858d37f5074d17e6937608178067", version
          print("Built targeted frontend:", version["build_id"])
          PY

      - name: Package frontend
        run: tar -C frontend/build -czf /tmp/bidblitz-mining-trust-frontend.tgz .

      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Upload frontend package
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e scp -o StrictHostKeyChecking=no             /tmp/bidblitz-mining-trust-frontend.tgz             root@212.227.20.190:/tmp/

      - name: Atomically activate frontend
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@212.227.20.190 'bash -s' <<'REMOTE'
          set -euo pipefail
          FRONTEND=/var/www/bidblitz/frontend
          STAMP=$(date -u +%Y%m%d%H%M%S)
          OLD_FRONTEND="$FRONTEND/build.previous.$STAMP"
          NEW_FRONTEND="$FRONTEND/build.new"
          rm -rf "$NEW_FRONTEND"
          mkdir -p "$NEW_FRONTEND"
          tar -xzf /tmp/bidblitz-mining-trust-frontend.tgz -C "$NEW_FRONTEND"
          test -s "$NEW_FRONTEND/index.html"
          test -s "$NEW_FRONTEND/version.json"
          test -s "$NEW_FRONTEND/service-worker.js"
          nginx -t

          swapped=0
          rollback() {
            result=$?
            trap - ERR
            if [ "$swapped" = "1" ]; then
              rm -rf "$FRONTEND/build.failed.$STAMP"
              if [ -d "$FRONTEND/build" ]; then mv "$FRONTEND/build" "$FRONTEND/build.failed.$STAMP"; fi
              if [ -d "$OLD_FRONTEND" ]; then mv "$OLD_FRONTEND" "$FRONTEND/build"; fi
              systemctl reload nginx || true
            fi
            echo "Mining trust frontend deploy rolled back"
            exit "$result"
          }
          trap rollback ERR

          if [ -d "$FRONTEND/build" ]; then mv "$FRONTEND/build" "$OLD_FRONTEND"; fi
          mv "$NEW_FRONTEND" "$FRONTEND/build"
          swapped=1
          chown -R www-data:www-data "$FRONTEND/build"
          nginx -t
          systemctl reload nginx
          curl -fsS --retry 8 --retry-delay 2 https://bidblitz.ae/ -o /dev/null
          trap - ERR
          rm -f /tmp/bidblitz-mining-trust-frontend.tgz
          echo "Mining trust frontend activated; previous frontend: $OLD_FRONTEND"
          REMOTE

      - name: Verify live version and removed labels
        run: |
          set -euo pipefail
          stamp=$(date +%s)
          curl -fsS --retry 8 --retry-delay 2 "https://bidblitz.ae/version.json?deploy=$stamp" -o /tmp/live-version.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          actual = json.loads(Path("/tmp/live-version.json").read_text())
          assert actual["git_commit"] == "83c3047ee3d4858d37f5074d17e6937608178067", actual
          print("Verified live frontend:", actual["build_id"])
          PY
          python3 - <<'PY'
          import json, urllib.request
          base = "https://bidblitz.ae"
          with urllib.request.urlopen(base + "/asset-manifest.json") as r:
              manifest = json.load(r)
          needles = [
              "Dubai Preview-Visual",
              "Abu Dhabi Preview-Visual",
              "Preview · Keine verifizierte Live-Hardware",
              "Preview placeholder",
              "Preview-Platzhalter",
          ]
          hits = []
          for path in manifest.get("files", {}).values():
              if not str(path).endswith(".js"):
                  continue
              with urllib.request.urlopen(base + path) as r:
                  text = r.read().decode("utf-8", "ignore")
              for needle in needles:
                  if needle in text:
                      hits.append((path, needle))
          assert not hits, hits
          print("Verified: old Preview labels are absent from live JavaScript.")
          PY
