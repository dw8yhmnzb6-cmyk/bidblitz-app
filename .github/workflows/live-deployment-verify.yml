name: BidBlitz Live Deployment Verification

on:
  workflow_run:
    workflows:
      - Deploy to IONOS Production
    types:
      - completed

jobs:
  verify-live-frontend:
    name: Verify live frontend cache policy & build identity
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify bidblitz.ae after deploy
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Live verification attempt ${attempt}/3"
            if python3 scripts/live_verify.py \
              --base-url https://bidblitz.ae \
              --expected-commit "$DEPLOYED_SHA"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Live state is not consistent yet; retrying in 10 seconds..."
              sleep 10
            fi
          done
          echo "::error::Live cache policy/build identity did not converge after 3 attempts."
          exit 1

      - name: Upload live verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bidblitz-live-deployment-verification
          path: test_reports/deployment/live_verification.json
          if-no-files-found: warn
          retention-days: 14
