name: Diagnose Live UI Admin Map Once
on:
  push:
    branches: [work/cache-update-hardening]
    paths: [.github/workflows/diagnose-live-ui-admin-map-once.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Inspect live admin, map config and recent errors
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@212.227.20.190 'bash -s' <<'REMOTE'
          set -euo pipefail
          BACK=/var/www/bidblitz/backend
          FRONT=/var/www/bidblitz/frontend
          cd "$BACK"

          echo "=== ADMIN ACCOUNT ROLE ==="
          "$BACK/venv/bin/python" - <<'PY'
          import asyncio
          from core.database import db
          async def main():
              u = await db.users.find_one(
                  {"$or": [
                      {"email": "admin@bidblitz.ae"},
                      {"login_email": "admin@bidblitz.ae"},
                      {"canonical_email": "admin@bidblitz.ae"},
                  ]},
                  {"_id": 1, "email": 1, "login_email": 1, "canonical_email": 1, "role": 1, "is_active": 1}
              )
              if not u:
                  print("ADMIN_USER_NOT_FOUND")
              else:
                  print({
                      "id": str(u.get("_id")),
                      "email": u.get("email"),
                      "login_email": u.get("login_email"),
                      "canonical_email": u.get("canonical_email"),
                      "role": u.get("role"),
                      "is_active": u.get("is_active", True),
                  })
          asyncio.run(main())
          PY

          echo "=== MAPBOX CONFIG PRESENCE ==="
          if [ -f "$FRONT/.env" ]; then
            set +u
            . "$FRONT/.env" 2>/dev/null || true
            set -u
            if [ -n "${REACT_APP_MAPBOX_TOKEN:-}" ]; then
              echo "REACT_APP_MAPBOX_TOKEN_SET length=${#REACT_APP_MAPBOX_TOKEN}"
            else
              echo "REACT_APP_MAPBOX_TOKEN_MISSING"
            fi
          else
            echo "FRONTEND_ENV_MISSING"
          fi

          echo "=== RECENT NONE/ATTRIBUTE ERRORS ==="
          grep -Ei "NoneType.*attribute.*get|has no attribute 'get'|AttributeError" /root/.pm2/logs/api-error.log | tail -80 || true

          echo "=== RECENT ADMIN AUTH RESPONSES ==="
          grep -Ei '(/api/admin/|admin_required|Admin access required|403 Forbidden|401 Unauthorized)' /root/.pm2/logs/api-out.log | tail -100 || true

          echo "=== API HEALTH ==="
          curl -fsS https://bidblitz.ae/api/health || true
          REMOTE
