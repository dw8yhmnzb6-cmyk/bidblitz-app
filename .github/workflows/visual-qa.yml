name: BidBlitz Visual QA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    env:
      QA_BASE_URL: ${{ secrets.QA_BASE_URL }}
      QA_USER_EMAIL: ${{ secrets.QA_USER_EMAIL }}
      QA_USER_PASSWORD: ${{ secrets.QA_USER_PASSWORD }}
      QA_ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
      QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
      QA_REPORT_UPLOAD_URL: ${{ secrets.QA_REPORT_UPLOAD_URL }}
      VISUAL_QA_REPORT_TOKEN: ${{ secrets.VISUAL_QA_REPORT_TOKEN }}
      QA_VISUAL_REVIEW_URL: ${{ secrets.QA_VISUAL_REVIEW_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm --workspace frontend run build

      - name: Prepare QA output directory
        run: rm -rf frontend/qa-output && mkdir -p frontend/qa-output/screenshots

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run auction visual tests
        run: npx playwright test tests/visual/auctions.spec.ts
        working-directory: frontend

      - name: Run taxi visual tests
        run: npx playwright test tests/visual/taxi.spec.ts
        working-directory: frontend

      - name: Generate numeric report
        run: node frontend/scripts/visual-qa/numeric-format-validation.mjs

      - name: Generate translation report
        run: node frontend/scripts/visual-qa/translation-consistency.mjs

      - name: Generate design report
        run: node frontend/scripts/visual-qa/design-consistency.mjs

      - name: Generate product image report
        run: node frontend/scripts/visual-qa/product-image-validation.mjs

      - name: Optional AI screenshot review
        run: node frontend/scripts/visual-qa/ai-screenshot-review.mjs

      - name: Generate QA report
        run: node frontend/scripts/visual-qa/compile-report.mjs

      - name: Prepare repair draft
        run: node frontend/scripts/visual-qa/prepare-repair-pr.mjs

      - name: Upload report summary to admin API
        run: node frontend/scripts/visual-qa/upload-report.mjs

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: bidblitz-visual-screenshots
          path: frontend/qa-output/screenshots

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: bidblitz-visual-qa-html
          path: visual-qa-report.html

      - name: Upload JSON report
        uses: actions/upload-artifact@v4
        with:
          name: bidblitz-visual-qa-json
          path: visual-qa-report.json