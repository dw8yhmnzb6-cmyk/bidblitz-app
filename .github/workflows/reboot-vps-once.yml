name: One-time Production VPS Reboot

on:
  push:
    branches:
      - work/cache-update-hardening
    paths:
      - .github/workflows/reboot-vps-once.yml

permissions:
  contents: read

jobs:
  reboot-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Capture boot id and schedule reboot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          command_timeout: 1m
          script: |
            set -e
            cat /proc/sys/kernel/random/boot_id > /var/tmp/bidblitz-pre-reboot-bootid
            echo "Pre-reboot boot id saved."
            nohup sh -c 'sleep 5; /sbin/reboot' >/var/tmp/bidblitz-reboot.log 2>&1 &
            echo "Reboot scheduled."

      - name: Wait for reboot
        run: sleep 45

      - name: Verify new boot and local services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          command_timeout: 5m
          script: |
            set -e
            OLD_BOOT_ID="$(cat /var/tmp/bidblitz-pre-reboot-bootid)"
            NEW_BOOT_ID="$(cat /proc/sys/kernel/random/boot_id)"
            echo "Old boot id: $OLD_BOOT_ID"
            echo "New boot id: $NEW_BOOT_ID"
            test "$OLD_BOOT_ID" != "$NEW_BOOT_ID"
            rm -f /var/tmp/bidblitz-pre-reboot-bootid /var/tmp/bidblitz-reboot.log
            systemctl is-active nginx
            nginx -t
            READY=0
            for i in $(seq 1 60); do
              if curl -fsS --max-time 5 http://127.0.0.1:8001/api/system/version >/dev/null 2>&1; then
                READY=1
                break
              fi
              sleep 3
            done
            test "$READY" = 1
            echo "Local BidBlitz API is ready after reboot."

      - name: Verify public BidBlitz
        run: |
          set -euo pipefail
          READY=0
          for i in $(seq 1 50); do
            if curl -fsS --max-time 8 https://bidblitz.ae/ >/dev/null \
              && curl -fsS --max-time 8 https://bidblitz.ae/api/system/version >/dev/null \
              && curl -fsS --max-time 8 https://bidblitz.ae/api/mining/capabilities >/dev/null; then
              READY=1
              break
            fi
            sleep 3
          done
          test "$READY" = 1
          echo "Public BidBlitz is healthy after VPS reboot."
