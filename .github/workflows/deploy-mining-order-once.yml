name: One-time Mining Ordering Live Deploy

on:
  push:
    branches:
      - work/cache-update-hardening
    paths:
      - .github/workflows/deploy-mining-order-once.yml

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-mining-ordering:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact tested source
        uses: actions/checkout@v4
        with:
          ref: 00a2c853aa7a76244d396d6351ee9f64a1ca374e
          fetch-depth: 0

      - name: Keep unreleased auction frontend out of this deploy
        run: |
          set -euo pipefail
          git checkout fdeff2463b99db8999f4898ccaaf3664ba8c582c -- \
            frontend/src/components/auctions/AuctionGridCard.jsx \
            frontend/src/pages/AuctionAdminPage.jsx \
            frontend/src/pages/AuctionsPage.jsx
          changed="$(git diff --name-only fdeff2463b99db8999f4898ccaaf3664ba8c582c -- frontend/src | sort)"
          printf "%s\n" "$changed"
          test "$changed" = "frontend/src/pages/MiningPage.jsx"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Build targeted frontend
        working-directory: frontend
        env:
          CI: 'false'
          GENERATE_SOURCEMAP: 'false'
          REACT_APP_BACKEND_URL: ${{ secrets.PROD_REACT_APP_BACKEND_URL || 'https://bidblitz.ae' }}
          REACT_APP_MAPBOX_TOKEN: ${{ secrets.PROD_REACT_APP_MAPBOX_TOKEN }}
          REACT_APP_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PROD_STRIPE_PUBLISHABLE_KEY || secrets.PROD_REACT_APP_STRIPE_PUBLISHABLE_KEY }}
          REACT_APP_TEST_MODE: 'false'
        run: |
          set -euo pipefail
          export BUILD_ID="$(git rev-parse --short HEAD)-$(date -u +%Y%m%d%H%M%S)"
          cat > .env <<EOF
          REACT_APP_BACKEND_URL=${REACT_APP_BACKEND_URL}
          REACT_APP_MAPBOX_TOKEN=${REACT_APP_MAPBOX_TOKEN}
          REACT_APP_STRIPE_PUBLISHABLE_KEY=${REACT_APP_STRIPE_PUBLISHABLE_KEY}
          REACT_APP_TEST_MODE=false
          REACT_APP_BUILD_ID=${BUILD_ID}
          EOF
          npm run build
          test -s build/index.html
          test -s build/version.json
          test -s build/service-worker.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          version = json.loads(Path("build/version.json").read_text())
          assert version["git_commit"] == "00a2c853aa7a76244d396d6351ee9f64a1ca374e", version
          print("Built targeted frontend:", version["build_id"])
          PY

      - name: Validate mining backend source
        run: |
          set -euo pipefail
          python3 -m py_compile backend/routes/mining.py
          grep -F '@router.post("/order-miner")' backend/routes/mining.py
          grep -F '"ordering_enabled": True' backend/routes/mining.py
          grep -F '"value_actions_enabled": bool(TEST_MODE)' backend/routes/mining.py

      - name: Package targeted release
        run: |
          set -euo pipefail
          tar -C frontend/build -czf /tmp/bidblitz-mining-frontend.tgz .
          cp backend/routes/mining.py /tmp/bidblitz-mining.py

      - name: Install SSH client helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Upload targeted release
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e scp -o StrictHostKeyChecking=no \
            /tmp/bidblitz-mining-frontend.tgz \
            /tmp/bidblitz-mining.py \
            root@212.227.20.190:/tmp/

      - name: Atomically activate mining ordering
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@212.227.20.190 'bash -s' <<'REMOTE'
          set -euo pipefail
          BACKEND=/var/www/bidblitz/backend
          FRONTEND=/var/www/bidblitz/frontend
          PY="$BACKEND/venv/bin/python"
          test -x "$PY"
          test -f "$BACKEND/routes/mining.py"
          pm2 describe api >/dev/null
          nginx -t

          STAMP=$(date -u +%Y%m%d%H%M%S)
          BACKUP="/var/www/bidblitz/mining-order-backup-$STAMP"
          OLD_FRONTEND="$FRONTEND/build.previous.$STAMP"
          NEW_FRONTEND="$FRONTEND/build.new"
          mkdir -p "$BACKUP"
          cp -p "$BACKEND/routes/mining.py" "$BACKUP/mining.py"
          rm -rf "$NEW_FRONTEND"
          mkdir -p "$NEW_FRONTEND"
          tar -xzf /tmp/bidblitz-mining-frontend.tgz -C "$NEW_FRONTEND"
          test -s "$NEW_FRONTEND/index.html"
          test -s "$NEW_FRONTEND/version.json"
          test -s "$NEW_FRONTEND/service-worker.js"
          cp /tmp/bidblitz-mining.py "$BACKUP/mining.py.new"
          "$PY" -m py_compile "$BACKUP/mining.py.new"

          frontend_swapped=0
          rollback() {
            result=$?
            trap - ERR
            cp -p "$BACKUP/mining.py" "$BACKEND/routes/mining.py"
            pm2 restart api >/dev/null || true
            if [ "$frontend_swapped" = "1" ]; then
              rm -rf "$FRONTEND/build.failed.$STAMP"
              if [ -d "$FRONTEND/build" ]; then mv "$FRONTEND/build" "$FRONTEND/build.failed.$STAMP"; fi
              if [ -d "$OLD_FRONTEND" ]; then mv "$OLD_FRONTEND" "$FRONTEND/build"; fi
              systemctl reload nginx || true
            fi
            echo "Mining ordering deploy rolled back; backup: $BACKUP"
            exit "$result"
          }
          trap rollback ERR

          install -m 644 /tmp/bidblitz-mining.py "$BACKEND/routes/mining.py"
          pm2 restart api

          verified=0
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 http://127.0.0.1:8001/api/mining/capabilities -o /tmp/mining-capabilities.json; then
              if "$PY" - /tmp/mining-capabilities.json <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          assert data["ordering_enabled"] is True, data
          assert data["live_mining_provider_connected"] is False, data
          assert data["provider_activation_enabled"] is False, data
          assert data["value_actions_enabled"] is False, data
          print("Backend mining ordering verified:", data)
          PY
              then verified=1; break; fi
            fi
            sleep 2
          done
          test "$verified" = 1

          if [ -d "$FRONTEND/build" ]; then mv "$FRONTEND/build" "$OLD_FRONTEND"; fi
          mv "$NEW_FRONTEND" "$FRONTEND/build"
          frontend_swapped=1
          chown -R www-data:www-data "$FRONTEND/build"
          nginx -t
          systemctl reload nginx

          curl -fsS --retry 8 --retry-delay 2 https://bidblitz.ae/api/mining/capabilities -o /tmp/public-mining-capabilities.json
          "$PY" - /tmp/public-mining-capabilities.json <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          assert data["ordering_enabled"] is True, data
          assert data["live_mining_provider_connected"] is False, data
          assert data["value_actions_enabled"] is False, data
          print("Public mining capabilities verified:", data)
          PY

          trap - ERR
          rm -f /tmp/bidblitz-mining-frontend.tgz /tmp/bidblitz-mining.py /tmp/mining-capabilities.json /tmp/public-mining-capabilities.json
          echo "Mining ordering activated; backup: $BACKUP; previous frontend: $OLD_FRONTEND"
          REMOTE

      - name: Verify live frontend version
        run: |
          set -euo pipefail
          stamp=$(date +%s)
          curl -fsS --retry 8 --retry-delay 2 "https://bidblitz.ae/version.json?deploy=$stamp" -o /tmp/live-version.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path("frontend/build/version.json").read_text())
          actual = json.loads(Path("/tmp/live-version.json").read_text())
          assert actual["build_id"] == expected["build_id"], (actual, expected)
          assert actual["git_commit"] == "00a2c853aa7a76244d396d6351ee9f64a1ca374e", actual
          print("Verified live frontend:", actual["build_id"])
          PY
          curl -fsS --retry 8 --retry-delay 2 https://bidblitz.ae/api/mining/capabilities
